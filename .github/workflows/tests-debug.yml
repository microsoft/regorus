name: tests/debug

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run at 8:00 AM every day
    - cron: "0 8 * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Rust toolchain
      uses: ./.github/actions/toolchains/rust
    - name: Cache cargo
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        shared-key: ${{ runner.os }}-regorus
    - name: Fetch dependencies
      run: cargo fetch --locked
    - name: Check allocator features and lifecycle tests
      run: |
        cargo check --frozen --no-default-features --features std,arc,full-opa,rvm,allocator-memory-limits
        cargo test --manifest-path mimalloc/Cargo.toml --features allocator-memory-limits --frozen execution_budget_
        cargo test --manifest-path mimalloc/Cargo.toml --features allocator-memory-limits --frozen mimalloc::tests::allocator_preserves_zeroed_aligned_reallocations -- --exact
        cargo test --frozen --no-default-features --features std,arc,full-opa,rvm,allocator-memory-limits --lib native_resume_
        cargo test --frozen --no-default-features --features std,arc,full-opa,rvm,allocator-memory-limits --lib resume_deserialization_limit_error_capture_
    - name: Run debug CI suite
      run: cargo xtask ci-debug --frozen
