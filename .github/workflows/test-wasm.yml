name: bindings/wasm

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run at 8:00 AM every day
    - cron: "0 8 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: ./.github/actions/toolchains/rust
      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ runner.os }}-regorus
      - name: Fetch dependencies
        run: cargo fetch --locked

      - name: Fetch WASM crate dependencies
        run: cargo fetch --locked --manifest-path bindings/wasm/Cargo.toml

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install wasm-pack
        shell: bash
        run: |
          set -euo pipefail
          asset_url=https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz
          asset_sha256=c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
          install_dir="$RUNNER_TEMP/wasm-pack-0.15.0"
          archive="$RUNNER_TEMP/wasm-pack-0.15.0.tar.gz"

          mkdir -p "$install_dir"
          curl -fsSL "$asset_url" -o "$archive"
          echo "${asset_sha256}  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$install_dir"

          wasm_pack_bin="$install_dir/wasm-pack-v0.15.0-x86_64-unknown-linux-musl/wasm-pack"
          test -x "$wasm_pack_bin"
          echo "$(dirname "$wasm_pack_bin")" >> "$GITHUB_PATH"

          wasm_pack_version="$("$wasm_pack_bin" --version)"
          test "$wasm_pack_version" = "wasm-pack 0.15.0"
          echo "$wasm_pack_version"

      - name: Test wasm binding via xtask
        run: cargo xtask test-wasm --release --frozen --node node
