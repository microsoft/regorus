[package]
name = "junco-core"
description = "Portable rule tables and lowering for Regorus history rules"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/microsoft/regorus"

[features]
default = []
serde = ["dep:serde", "history-syntax/serde"]
std = ["history-syntax/std"]
runtime = []
test-util = ["runtime"]

[dependencies]
thiserror = { version = "2", default-features = false }
history-syntax = { path = "../history-syntax", version = "0.1.0", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }

[dev-dependencies]
serde_json = { version = "1", default-features = false, features = ["alloc"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
