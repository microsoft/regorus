[package]
name = "history-syntax"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT OR Apache-2.0"
publish = false

[package.metadata.verus]
verify = true

[features]
default = []
serde = ["dep:serde"]
std = ["vstd/std"]

[dependencies]
vstd = { version = "=0.0.0-2026-10-04-0306", default-features = false, features = ["alloc"] }
frunk_core = { version = "=0.5.0", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"], optional = true }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }
