  - note: undefined_negated_assignments
    data: {}
    input: {}
    modules:
      - |
        package test

        main := {
          "missing": [true | not _ := input.missing],
          "nested_assignment": [true | not _ := [true | _ := input.missing]],
          "nested_head": [true | not _ := [input.missing | true]],
          "nested_condition": [true | not _ := [true | input.missing == 1]],
          "nested_assignment_count": [true | not count([true | _ := input.missing]) > 0],
          "nested_condition_count": [true | not count([true | input.missing == 1]) > 0],
          "object": [true | not _ := {"key": input.missing | true}],
          "loop": [i | some i in [1, 2]; not _ := input.missing],
        }
    query: data.test.main
    want_result:
      missing: [true]
      nested_assignment: []
      nested_head: []
      nested_condition: []
      nested_assignment_count: [true]
      nested_condition_count: [true]
      object: []
      loop: [1, 2]

