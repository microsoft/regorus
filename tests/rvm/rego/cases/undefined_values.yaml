      object_key: [0]
      object_value: [0]
      loop_assignment: [0, 0]
      loop_array_head: [0, 0]
      loop_object_key: [0, 0]
      loop_object_value: [0, 0]
      inner_loop: [0, 0]
      mixed: [2, 2]
      every: [true]
