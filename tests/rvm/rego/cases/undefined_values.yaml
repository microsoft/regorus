  - note: undefined_nested_comprehensions
    data: {}
    input: {}
    modules:
      - |
        package test

        main := {
          "assignment": [true | _ := [true | _ := input.missing]],
          "array_head": [count([input.missing | true]) | true],
          "object_key": [count({input.missing: true | true}) | true],
          "object_value": [count({"key": input.missing | true}) | true],
          "loop_assignment": [count([true | _ := input.missing]) | some i in [1, 2]],
          "loop_array_head": [count([input.missing | true]) | some i in [1, 2]],
          "loop_object_key": [count({input.missing: true | true}) | some i in [1, 2]],
          "loop_object_value": [count({"key": input.missing | true}) | some i in [1, 2]],
          "inner_loop": [count([x | some x in [1, 2]; _ := input.missing]) | some i in [1, 2]],
          "mixed": [count([x.value | some x in [{"value": false}, {}, {"value": null}]]) | some i in [1, 2]],
          "every": [true | every i in [1, 2] { count([input.missing | true]) == 0 }],
        }
    query: data.test.main
    want_result:
      assignment: [true]
      array_head: [0]
      object_key: [0]
      object_value: [0]
      loop_assignment: [0, 0]
      loop_array_head: [0, 0]
      loop_object_key: [0, 0]
      loop_object_value: [0, 0]
      inner_loop: [0, 0]
      mixed: [2, 2]
      every: [true]

  - note: undefined_loop_else
    data: {}
    input:
      items: [{}]
    modules:
      - |
        package test

        p := 1 if { some x in input.items; _ := x.missing } else := 2
        f(items) := 1 if { some x in items; _ := x.missing } else := 2
        false_fallback := 1 if { some x in input.items; _ := x.missing } else := false
        null_fallback := 1 if { some x in input.items; _ := x.missing } else := null
        empty_fallback := 1 if { some x in input.items; _ := x.missing } else := []
        found(items) := x.value if { some x in items; _ := x.value } else := "fallback"

        main := {
          "rule": p,
          "function": f(input.items),
          "empty": f([]),
          "false": false_fallback,
          "null": null_fallback,
          "array": empty_fallback,
          "defined": found([{}, {"value": false}, {}]),
          "mixed": f([{}, {"missing": false}, {}]),
        }
    query: data.test.main
    want_result:
      rule: 2
      function: 2
      empty: 2
      "false": false
      "null": null
      array: []
      defined: false
      mixed: 1

