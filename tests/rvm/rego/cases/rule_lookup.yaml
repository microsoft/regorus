  - note: dynamic_host_direct_rule_suffix_suspendable
    strict: false
    skip_interpreter: true
    execution_mode: suspendable
    input: &host_input {namespace: target, subject: dummy, key: blocked}
    modules: &suffix_modules
      - |
        package framework
        default result := 99
        result := data.config[input.namespace].record.a.b
      - |
        package config.target
        record := __builtin_host_await(input.subject, "selected")
    query: data.framework.result
    host_await_responses_suspendable:
      - {id: selected, args: dummy, value: {a: {b: 7}}}
    want_result: 7

  - note: dynamic_host_direct_rule_suffix_rtc
    strict: false
    skip_interpreter: true
    input: *host_input
    modules: *suffix_modules
    query: data.framework.result
    host_await_responses:
      - {id: selected, value: {a: {b: 7}}}
    want_result: 7

  - note: dynamic_nested_resumes_remainder_and_cached_reference
    strict: false
    skip_interpreter: true
    execution_mode: suspendable
    input: *host_input
    modules: &nested_modules
      - |
        package framework
        import rego.v1
        result := [data.config[input.namespace].record[input.key],
                   data.config[input.namespace].record.blocked]
      - |
        package config.target
        import rego.v1
        record := {"blocked": nested}
        nested := [data.config[input.namespace].first,
                   __builtin_host_await(input.subject, "second")]
        first := __builtin_host_await(input.subject, "first")
    query: data.framework.result
    host_await_responses_suspendable:
      - {id: first, args: dummy, value: true}
      - {id: second, args: dummy, value: false}
    want_result: [[true, false], [true, false]]

  - note: dynamic_nested_rtc_control
    strict: false
    skip_interpreter: true
    input: *host_input
    modules: *nested_modules
    query: data.framework.result
    host_await_responses:
      - {id: first, value: true}
      - {id: second, value: false}
    want_result: [[true, false], [true, false]]

  - note: native_rule_depth_is_bounded
    strict: false
    skip_interpreter: true
    modules: &deep_rules
      - |
        package probe
        r0 := data.probe.r1
        r1 := data.probe.r2
        r2 := data.probe.r3
        r3 := data.probe.r4
        r4 := data.probe.r5
        r5 := data.probe.r6
        r6 := data.probe.r7
        r7 := data.probe.r8
        r8 := data.probe.r9
        r9 := data.probe.r10
        r10 := data.probe.r11
        r11 := data.probe.r12
        r12 := data.probe.r13
        r13 := data.probe.r14
        r14 := data.probe.r15
        r15 := data.probe.r16
        r16 := data.probe.r17
        r17 := data.probe.r18
        r18 := data.probe.r19
        r19 := data.probe.r20
        r20 := 7
    query: data.probe.r0
    want_error: "Rule call depth exceeded safety limit 16"

  - note: suspendable_rule_depth_uses_explicit_frames
    strict: false
    execution_mode: suspendable
    modules: *deep_rules
    query: data.probe.r0
    want_result: 7

