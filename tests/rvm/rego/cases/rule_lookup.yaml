    data: {catalog: {empty: {base: 5}}}
    modules: &nested_function_namespace_modules
      - |
        package catalog.empty
        default f(x) := true
      - |
        package probe
        result := [data.catalog.empty, data.catalog[input.key]]
        missing := data.catalog.empty.absent
        nonexistent := data.unknown
        ancestor := count(data.catalog)
    query: data.probe.result
    want_result: [{base: 5}, {base: 5}]

