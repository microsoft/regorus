  - note: virtual_reference_missing_suffix_is_undefined
    strict: false
    input: {key: p}
    modules:
      - |
        package probe
        nested.p := {"a": {"b": 7}}
        result := data.probe.nested[input.key].a.missing
    query: data.probe.result
    want_result: "#undefined"

  - note: virtual_reference_missing_rule_uses_base_data
    strict: false
    data: {probe: {nested: {base: {a: {b: 8}}}}}
    input: {key: base}
    modules:
      - |
        package probe
        nested.p := {"a": {"b": 7}}
        result := data.probe.nested[input.key].a.b
    query: data.probe.result
    want_result: 8

  - note: virtual_reference_namespace_merges_base_data
    strict: false
    data: {probe: {nested: {p: {base: 8}}}}
    input: {key: p}
    modules:
      - |
        package probe
        nested.p.value := 7
        result := data.probe.nested[input.key]
    query: data.probe.result
    want_result: {base: 8, value: 7}

  - note: virtual_reference_invalid_index_is_undefined
    strict: false
    input: {key: p, index: {}}
    modules:
      - |
        package probe
        nested.p := {"a": [7]}
        result := data.probe.nested[input.key].a[input.index]
    query: data.probe.result
    want_result: "#undefined"

  - note: virtual_reference_empty_set_and_negation
    strict: false
    execution_mode: suspendable
    input: {key: p}
    modules:
      - |
        package probe
        nested.p := {"a": set()}
        result := data.probe.nested[input.key].a if {
          not data.probe.nested[input.key].missing
        }
    query: data.probe.result
    want_result: {"set!": []}

  - note: virtual_reference_default_only_rule
    strict: false
    input: {key: p}
    modules:
      - |
        package probe
        default nested.p := {"a": {"b": 7}}
        result := data.probe.nested[input.key].a.b
    query: data.probe.result
    want_result: 7

  - note: virtual_reference_excludes_recursive_sibling
    strict: false
    input: {key: p}
    modules:
      - |
        package probe
        nested.p := {"a": {"b": 7}}
        recursive := data.probe.recursive
        result := data.probe.nested[input.key].a.b
    query: data.probe.result
    want_result: 7

  - note: dynamic_tenant_deny_true_rtc
    strict: false
    data: {}
    input: {tenant: a}
    modules: &tenant_deny_modules
      - |
        package tenant
        a := {"deny": true}
      - |
        package auth
        default allow := false
        allow if { not data.tenant[input.tenant].deny }
        default static_allow := false
        static_allow if { not data.tenant.a.deny }
    query: data.auth.allow
    want_result: false

  - note: dynamic_tenant_deny_true_suspendable
    strict: false
    execution_mode: suspendable
    data: {}
    input: {tenant: a}
    modules: *tenant_deny_modules
