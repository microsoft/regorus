cases:
  - note: virtual_reference_same_namespace_static_suffix
    strict: false
    skip_interpreter: true
    input: {key: p}
    modules:
      - |
        package probe
        p := {"a": {"b": 7}}
        result := data.probe[input.key].a.b
    query: data.probe.result
    want_result: 7

  - note: virtual_reference_same_namespace_missing_key
    strict: false
    skip_interpreter: true
    execution_mode: suspendable
    input: {key: missing}
    modules:
      - |
        package probe
        p := {"a": {"b": 7}}
        result := data.probe[input.key].a.b
    query: data.probe.result
    want_result: "#undefined"

  - note: virtual_reference_static_suffix
    strict: false
    input: {key: p}
    modules: &object_suffix_modules
      - |
        package probe
        nested.p := {"a": {"b": 7}}
        result := data.probe.nested[input.key].a.b
    query: data.probe.result
    want_result: 7

  - note: virtual_reference_rule_path_suffix
    strict: false
    execution_mode: suspendable
    input: {key: p}
    modules: &rule_suffix_modules
      - |
        package probe
        nested.p.value := 7
        result := data.probe.nested[input.key].value
    query: data.probe.result
    want_result: 7

  - note: virtual_reference_static_suffix_suspendable
    strict: false
    execution_mode: suspendable
    input: {key: p}
    modules: *object_suffix_modules
    query: data.probe.result
    want_result: 7

