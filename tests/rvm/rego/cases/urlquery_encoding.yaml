cases:
  - note: urlquery_encoding_canonical_components
    strict: false
    data: {}
    input: ["~* ", "", "AZaz09-_.", "+%&=#?/", "\u00e9\u4e2d", "\u0000\n\r\t"]
    modules:
      - |
        package test
        result := [urlquery.encode(s) | s := input[_]]
    query: data.test.result
    want_result:
      - "~%2A+"
      - ""
      - "AZaz09-_."
      - "%2B%25%26%3D%23%3F%2F"
      - "%C3%A9%E4%B8%AD"
      - "%00%0A%0D%09"

  - note: urlquery_encoding_object_grouping_and_order
    strict: false
    execution_mode: suspendable
    data: {}
    modules:
      - |
        package test
        result := {
          "fields": urlquery.encode_object({
            "~* ": ["~", "*", " ", "+%&="],
            "z": {"b", "a"},
            "empty": [],
            "": "",
            "a": "\u00e9",
          }),
          "empty": urlquery.encode_object({}),
          "empty_collections": urlquery.encode_object({"a": [], "b": set()}),
        }
    query: data.test.result
    want_result:
      fields: "=&a=%C3%A9&z=a&z=b&~%2A+=~&~%2A+=%2A&~%2A+=+&~%2A+=%2B%25%26%3D"
      empty: ""
      empty_collections: ""
