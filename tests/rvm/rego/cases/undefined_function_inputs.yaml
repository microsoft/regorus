cases:
  - note: undefined_function_input
    data: {}
    input: {}
    modules: &undefined_input
      - |
        package test
        f(_) := true
        main := f(input.missing)
    query: data.test.main
    want_result: "#undefined"

  - note: undefined_function_input_suspendable
    data: {}
    input: {}
    modules: *undefined_input
    execution_mode: suspendable
    query: data.test.main
    want_result: "#undefined"

  - note: undefined_function_inputs_preserve_defined_values_and_negation
    data: {}
    input: {}
    modules: &input_boundaries
      - |
        package test
        f(_) := true
        pair(_, _) := true
        constant() := true
        main if {
          not f(input.missing)
          not pair(input.missing, 1)
          not pair(1, input.missing)
          f(false)
          f(null)
          f(0)
          f("")
          f([])
          f({})
          f(set())
          constant()
          [f(item.value) | some item in [{}, {"value": false}, {}, {"value": null}]] == [true, true]
        }
    query: data.test.main
    want_result: true

  - note: undefined_function_inputs_preserve_defined_values_and_negation_suspendable
    data: {}
    input: {}
    modules: *input_boundaries
    execution_mode: suspendable
    strict_builtin_errors: true
    query: data.test.main
    want_result: true
