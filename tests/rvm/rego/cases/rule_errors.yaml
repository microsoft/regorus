# Every case checks the interpreter and all three VM execution paths.
cases:
  - note: issue_932_tier_conflict_nonstrict
    execution_mode: all
    strict_builtin_errors: false
    input: &repro_input {gold: true, silver: true, published: yesterday, key: tier}
    modules: &repro
      - |
        package repro
        tier := "gold" if input.gold
        tier := "silver" if input.silver
        age := time.now_ns() - time.parse_rfc3339_ns(input.published)
        deny contains "published less than a day ago" if {
          age < ((24 * 60) * 60) * 1000000000
        }
        nested := tier
        parsed(x) := time.parse_rfc3339_ns(x)
        parsed_result := parsed(input.published)
        f(x) := input.gold if x
        f(x) := input.silver if x
        function_result := f(true)
        default fallback := "fallback"
        fallback := parsed_result
        default allow := true
        allow := false if count(deny) > 0
        default conflict_default := "fallback"
        conflict_default := tier
        conflict_else := tier if input.gold else := "fallback"
        parse_else := parsed_result if input.gold else := "fallback"
        conflict_set contains tier
        conflict_object[k] := tier if k := input.key
        parsed_object[k] := parsed_result if k := input.key
        loop_result := [tier | some _ in input.items]
        parsed_loop := [parsed(x) | some x in input.items]
        negated if not parsed_result
    query: data.repro.tier
    want_error: conflicts

  - note: issue_932_tier_conflict_strict
    execution_mode: all
    strict_builtin_errors: true
    input: *repro_input
    modules: *repro
    query: data.repro.tier
    want_error: conflicts

