  - note: rule_error_ordering_lt_string_number_strict
    execution_mode: all
    strict_builtin_errors: true
    input: &string_number {left: text, right: 0}
    modules: &relational_ordering
      - |
        package ordering
        default lt := false
        lt if input.left < input.right
        default le := false
        le if input.left <= input.right
        default gt := false
        gt if input.left > input.right
        default ge := false
        ge if input.left >= input.right
        result := {"lt": lt, "le": le, "gt": gt, "ge": ge}
    query: data.ordering.lt
    want_result: false

