  - note: rule_error_controls_strict
    execution_mode: all
    strict_builtin_errors: true
    input: &controls_input {value: 7, enabled: true, items: [1, 2, 3]}
    modules: &controls
      - |
        package controls
        same := input.value if input.enabled
        same := input.value if input.enabled
        missing := input.missing
        failed if false
        false_value := false
        default defaulted := "default"
        defaulted := "body" if input.disabled
        alternative := "first" if input.disabled else := "else"
        pattern([x, y]) := x + y
        pattern([x]) := x
        pattern_result := pattern([9])
        mismatched := pattern([1, 2, 3])
        missing_ok if not missing
        failed_ok if not failed
        mismatch_ok if not mismatched
        filtered := [x | some x in input.items; x > 1]
        result := {
          "same": same,
          "missing": missing_ok,
          "failed": failed_ok,
          "false": false_value,
          "default": defaulted,
          "else": alternative,
          "pattern": pattern_result,
          "mismatch": mismatch_ok,
          "filtered": filtered,
        }
    query: data.controls.result
    want_result: &controls_result
      same: 7
      missing: true
      failed: true
      "false": false
      default: default
      else: else
      pattern: 9
      mismatch: true
      filtered: [2, 3]

  - note: rule_error_controls_nonstrict
    execution_mode: all
    strict_builtin_errors: false
    input: *controls_input
    modules: *controls
    query: data.controls.result
    want_result: *controls_result

