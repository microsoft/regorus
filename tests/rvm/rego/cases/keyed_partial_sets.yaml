cases:
  - note: keyed_partial_set_rejects_dynamic_dotted_prefix
    modules:
      - |
        package test
        values[group].fixed contains 1 if { group := "g" }
        main := values
    query: data.test.main
    want_error: "partial object rules with nested bracket keys are not yet supported by the RVM compiler"
    allow_interpreter_success: true

  - note: keyed_partial_set_rejects_dynamic_dotted_prefix_suspendable
    execution_mode: suspendable
    modules:
      - |
        package test
        values[group].fixed contains 1 if { group := "g" }
        main := data.test.values
    query: data.test.main
    want_error: "partial object rules with nested bracket keys are not yet supported by the RVM compiler"
    allow_interpreter_success: true

  - note: keyed_partial_set_rejects_flattened_static_prefix
    modules:
      - |
        package test
        values.fixed[k] contains 1 if { k := "a" }
        main := values
    query: data.test.main
    want_error: "partial object rules with nested bracket keys are not yet supported by the RVM compiler"
    allow_interpreter_success: true

  - note: keyed_partial_set_rejects_flattened_static_prefix_suspendable
    execution_mode: suspendable
    modules:
      - |
        package test
        values.fixed[k] contains 1 if { k := "a" }
        main := data.test.values
    query: data.test.main
    want_error: "partial object rules with nested bracket keys are not yet supported by the RVM compiler"
    allow_interpreter_success: true

  - note: keyed_partial_set_multiple_body_head_loops
    input: {keys: ["a", "b"]}
    modules:
      - |
        package test
        values[input.keys[_]] := 1 if { false } { true }
    query: data.test.values
    want_result:
      a: 1
      b: 1

  - note: keyed_partial_set_multiple_body_head_loops_suspendable
    execution_mode: suspendable
    input: {keys: ["a", "b"]}
    modules:
      - |
        package test
        values[input.keys[_]] := 1 if { false } { true }
    query: data.test.values
    want_result:
      a: 1
      b: 1

  - note: keyed_partial_set_scalar_head_collections
    input: {collections: [null, false, true, 42, "abc"]}
    modules:
      - |
        package test
        values[collection[_]] contains 1 if {
          some collection in input.collections
        }
    query: data.test.values
    want_result: {}

  - note: keyed_partial_set_scalar_head_collections_suspendable
    execution_mode: suspendable
    input: {collections: [null, false, true, 42, "abc"]}
    modules:
      - |
        package test
        values[collection[_]] contains 1 if {
          some collection in input.collections
        }
    query: data.test.values
    want_result: {}

  - note: keyed_partial_set_resolvable_key_failing_body
    input: {key: "a", enabled: false}
    modules:
      - |
        package test
        values[input.key] contains 1 if { input.enabled }
    query: data.test.values
    want_result: {}

  - note: keyed_partial_set_resolvable_key_failing_body_suspendable
    execution_mode: suspendable
    input: {key: "a", enabled: false}
    modules:
      - |
        package test
        values[input.key] contains 1 if { input.enabled }
    query: data.test.values
    want_result: {}

  - note: keyed_partial_set_failing_body_preserves_other_keys
    input: {key: "a", enabled: false}
    modules:
      - |
        package test
        values[input.key] contains 1 if { input.enabled }
        values[k] contains 2 if { k := "b" }
    query: data.test.values
    want_result:
      b:
        set!: [2]

  - note: keyed_partial_set_resolvable_key_undefined_body
    input: {key: "a"}
    modules:
      - |
        package test
        values[input.key] contains 1 if { input.enabled }
    query: data.test.values
    want_result: {}

  - note: review_missing_head_key_collection
    input: {}
    modules:
      - |
        package test
        values[input.keys[_]] contains 1 if { true }
    query: data.test.values
    want_result: {}

  - note: review_missing_head_key_collection_suspendable
    execution_mode: suspendable
    input: {}
    modules:
      - |
        package test
        values[input.keys[_]] contains 1 if { true }
    query: data.test.values
    want_result: {}

  - note: review_mixed_keyed_rule_kinds
    modules:
      - |
        package test
        values[k] contains 1 if { k := "a" }
        values[k] := 2 if { k := "a" }
    query: data.test.values
    want_error: "conflicting rule kinds"

  - note: review_mixed_keyed_rule_kinds_reverse
    execution_mode: suspendable
    modules:
      - |
        package test
        values[k] := 2 if { k := "a" }
        values[k] contains 1 if { k := "a" }
    query: data.test.values
    want_error: "conflicting rule kinds"

  - note: review_mixed_keyed_rule_kinds_equal_set
    modules:
      - |
        package test
        values[k] contains 1 if { k := "a" }
        values[k] := {1} if { k := "a" }
    query: data.test.values
    want_error: "conflicting rule kinds"
    allow_interpreter_success: true

  - note: review_mixed_literal_dynamic_keys
    modules:
      - |
        package test
        values["a"] contains 1
        values[k] contains 2 if { k := "a" }
    query: data.test.values
    want_result:
      a:
        set!: [1, 2]

  - note: review_mixed_literal_dynamic_keys_suspendable
    execution_mode: suspendable
    modules:
      - |
        package test
        values[k] contains 2 if { k := "a" }
        values["a"] contains 1
    query: data.test.values
    want_result:
      a:
        set!: [1, 2]

  - note: review_bodyless_head_key_loop
    input:
      keys: ["a", "b"]
    modules:
      - |
        package test
        values[input.keys[_]] contains 1
    query: data.test.values
    want_result:
      a:
        set!: [1]
      b:
        set!: [1]

  - note: review_mixed_dot_dynamic_keys
    modules:
      - |
        package test
        values.a contains 1
        values[k] contains 2 if { k := "a" }
    query: data.test.values
    want_result:
      a:
        set!: [1, 2]

  - note: review_mixed_literal_dynamic_keys_across_modules
    execution_mode: suspendable
    modules:
      - |
        package test.nested
        values["a"] contains 1 if { true }
      - |
        package test.nested
        values[k] contains 2 if { k := "a" }
    query: data.test.nested.values
    want_result:
      a:
        set!: [1, 2]

  - note: review_bodyless_missing_head_key_collection
    input: {}
    modules:
      - |
        package test
        values[input.keys[_]] contains 1
    query: data.test.values
    want_result: {}

  - note: review_mixed_literal_dynamic_child_entrypoint
    modules:
      - |
        package test
        values["a"] contains 1
        values[k] contains 2 if { k := "b" }
    query: data.test.values.a
    want_result:
      set!: [1]

  - note: review_empty_query_head_key_loop
    input:
      keys: ["a", "b"]
    modules:
      - |
        package test
        values[input.keys[_]] contains 1 if {}
    query: data.test.values
    want_result:
      a:
        set!: [1]
      b:
        set!: [1]

  - note: review_bodyless_head_key_loop_suspendable
    execution_mode: suspendable
    input:
      keys: ["a", "b"]
    modules:
      - |
        package test
        values[input.keys[_]] contains 1
    query: data.test.values
    want_result:
      a:
        set!: [1]
      b:
        set!: [1]

  - note: keyed_partial_set_accumulates_per_key
    modules:
      - |
        package test
        ports[host] contains port if {
          some host, values in {"web": [80, 443, 80], "db": [5432]}
          some port in values
        }
    query: data.test.ports
    want_result:
      web:
        set!: [80, 443]
      db:
        set!: [5432]

  - note: keyed_partial_set_multiple_definitions
    modules:
      - |
        package test
        values[key] contains value if {
          key := "a"
          value := 1
        }
        values[key] contains value if {
          key := "a"
          value := 2
        }
        values[key] contains value if {
          key := "b"
          value := 1
        }
    query: data.test.values
    want_result:
      a:
        set!: [1, 2]
      b:
        set!: [1]

  - note: keyed_partial_set_preserves_defined_values
    modules:
      - |
        package test
        values[key] contains value if {
          some key, value in {"false": false, "null": null, "zero": 0}
        }
    query: data.test.values
    want_result:
      "false":
        set!: [false]
      "null":
        set!: [null]
      zero:
        set!: [0]

  - note: keyed_partial_set_undefined_key
    input: {}
    modules:
      - |
        package test
        values[input.missing] contains 1 if { true }
    query: data.test.values
    want_result: {}

  - note: keyed_partial_set_undefined_value
    input: {}
    modules:
      - |
        package test
        values[key] contains input.missing if { key := "a" }
    query: data.test.values
    want_result: {}

  - note: keyed_partial_set_empty_body
    modules:
      - |
        package test
        values["a"] contains 1
        values["a"] contains 2
    query: data.test.values.a
    want_result:
      set!: [1, 2]

  - note: keyed_partial_set_unmatched_body
    modules:
      - |
        package test
        values[key] contains 1 if {
          key := "a"
          false
        }
    query: data.test.values
    want_result: {}

  - note: keyed_partial_set_head_key_loop
    input:
      keys: ["a", "b", "a"]
    modules:
      - |
        package test
        values[input.keys[_]] contains 1 if { true }
    query: data.test.values
    want_result:
      a:
        set!: [1]
      b:
        set!: [1]

  - note: keyed_partial_set_static_prefix
    modules:
      - |
        package test
        values.fixed[key] contains value if {
          some key, value in {"a": 1, "b": 2}
        }
    query: data.test.values.fixed
    want_result:
      a:
        set!: [1]
      b:
        set!: [2]

  - note: keyed_partial_set_mixed_missing_values
    input:
      values:
        a: 1
        b: false
    modules:
      - |
        package test
        values[key] contains input.values[key] if {
          some key in ["a", "missing", "b"]
        }
    query: data.test.values
    want_result:
      a:
        set!: [1]
      b:
        set!: [false]

  - note: keyed_partial_set_multiple_definitions_suspendable
    execution_mode: suspendable
    modules:
      - |
        package test
        values[key] contains value if {
          some key, value in {"a": 1, "b": 2}
        }
        values[key] contains 3 if { key := "a" }
    query: data.test.values
    want_result:
      a:
        set!: [1, 3]
      b:
        set!: [2]

  - note: keyed_partial_set_head_key_loop_suspendable
    execution_mode: suspendable
    input:
      keys: ["a", "b", "a"]
    modules:
      - |
        package test
        values[input.keys[_]] contains 1 if { true }
    query: data.test.values
    want_result:
      a:
        set!: [1]
      b:
        set!: [1]

  - note: keyed_partial_set_mixed_missing_values_suspendable
    execution_mode: suspendable
    input:
      values:
        a: 1
        b: false
    modules:
      - |
        package test
        values[key] contains input.values[key] if {
          some key in ["a", "missing", "b"]
        }
    query: data.test.values
    want_result:
      a:
        set!: [1]
      b:
        set!: [false]

  - note: keyed_partial_set_undefined_value_suspendable
    execution_mode: suspendable
    input: {}
    modules:
      - |
        package test
        values[key] contains input.missing if { key := "a" }
    query: data.test.values
    want_result: {}

  - note: keyed_partial_set_unmatched_body_suspendable
    execution_mode: suspendable
    modules:
      - |
        package test
        values[key] contains 1 if {
          key := "a"
          false
        }
    query: data.test.values
    want_result: {}

  - note: keyed_partial_set_numeric_key
    modules:
      - |
        package test
        values[1] contains value if { some value in [false, null] }
    query: data.test.values
    want_result:
      1:
        set!: [false, null]

  - note: keyed_partial_set_preserves_legacy_set_head
    rego_v0: true
    modules:
      - |
        package test
        values[value] { value := [1, 2, 1][_] }
    query: data.test.values
    want_result:
      set!: [1, 2]

  - note: keyed_partial_set_rejects_multiple_dynamic_key_levels
    modules:
      - |
        package test
        values[group][key] contains 1 if {
          group := "g"
          key := "k"
        }
        main := values
    query: data.test.main
    want_error: "partial object rules with nested bracket keys are not yet supported by the RVM compiler"
    allow_interpreter_success: true
