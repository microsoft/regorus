    modules:
      - |
        package test
        values.b contains 2
        values.a contains 1 if { false }
        values.c contains 3 if { false }
        main := values
    query: data.test.main
    want_result:
      a:
        set!: []
      b:
        set!: [2]
      c:
        set!: []

  - note: keyed_partial_set_static_empty_before_dynamic
    modules:
