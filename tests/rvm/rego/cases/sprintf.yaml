cases:
  - note: sprintf_q_rvm_quoting_unicode_width_precision
    data: {}
    modules:
      - |
        package test

        result := {
          "quoted": sprintf("%q", ["a\u2028b"]),
          "width": sprintf("%5q", ["é"]),
          "precision": sprintf("%.1q", ["éx"]),
        }
    query: data.test.result
    want_result:
      quoted: "\"a\\u2028b\""
      width: "  \"é\""
      precision: "\"é\""

  - note: sprintf_q_dynamic_indexed_and_value_conversions
    data: {}
    modules:
      - |
        package test

        result := {
          "dynamic": sprintf("%*.*q", [8, 1, "éx"]),
          "indexed": sprintf("%[3]*.[2]*[1]q", ["éx", 1, 8]),
          "rune": sprintf("%q", [97]),
          "array": sprintf("%q", [[1, "x"]]),
          "float": sprintf("%8q", [65.5]),
          "float_rounds_to_integer": sprintf("%.2q", [9.99]),
          "float_scientific_threshold": sprintf("%.2q", [0.00001]),
          "bad_index": sprintf("%[1]2q", ["x"]),
        }
    query: data.test.result
    want_result:
      dynamic: "     \"é\""
      indexed: "     \"é\""
      rune: "'a'"
      array: "\"[1, \\\"x\\\"]\""
      float: "%!q(float64=    65.5)"
      float_rounds_to_integer: "%!q(float64=10)"
      float_scientific_threshold: "%!q(float64=1e-05)"
      bad_index: "%!q(BADINDEX)"
