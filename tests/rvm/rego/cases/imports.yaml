cases:
  - note: import_cross_package_no_false_cycle
    modules:
      - |
        package registry
        import data.registry.packages.package_a
        allow_stage1 if package_a.allow_stage1
      - |
        package registry.packages.package_a
        import data.registry
        allow_stage2 if registry.allow_stage1
        allow_stage1 := true
    query: data.registry.packages.package_a.allow_stage2
    want_result: true

  - note: dynamic_data_index_evaluates_matching_rules
    modules:
      - |
        package registry
        allow_stage1 if {
          name := "package_a"
          data.registry.packages[name].allow_stage2
        }
      - |
        package registry.packages.package_a
        allow_stage2 := true
    query: data.registry.allow_stage1
    want_result: true

  # A wildcard leaf can still select a recursive rule; the RVM rejects that graph.
  - note: import_dynamic_leaf_retains_conservative_cycle_detection
    modules:
      - |
        package registry
        import data.registry.packages.package_a
        allow_stage1 if {
          key := "allow_stage1"
          package_a[key]
        }
      - |
        package registry.packages.package_a
        import data.registry
        allow_stage2 if registry.allow_stage1
        allow_stage1 := true
    query: data.registry.packages.package_a.allow_stage2
    want_error: "Compile-time recursion detected"
    allow_interpreter_success: true

  - note: import_dynamic_package_suffix_no_false_cycle
    modules:
      - |
        package registry
        import data.registry.packages as packages
        allow_stage1 if {
          name := "package_a"
          packages[name].allow_stage2
        }
      - |
        package registry.packages.package_a
        import data.registry
        unused if registry.allow_stage1
        allow_stage2 := true
    query: data.registry.allow_stage1
    want_result: true

  - note: import_literal_dot_package_suffix_no_false_cycle
    modules:
      - |
        package registry
        import data.registry.packages["package.a"] as selected
        allow_stage1 if selected.allow_stage1
      - |
        package registry.packages["package.a"]
        import data.registry as parent
        allow_stage2 if parent.allow_stage1
        allow_stage1 := true
    query: data.registry.packages["package.a"].allow_stage2
    want_result: true

  - note: import_unrelated_equal_length_namespace_is_materialized
    modules:
      - |
        package nope.allow
        result := data.auth
      - |
        package auth
        allow := true
    query: data.nope.allow.result
    want_result: {allow: true}

  - note: import_suffix_preserves_false
    modules:
      - |
        package lib
        value := false
      - |
        package rules
        import data.lib as alias
        result := alias.value
    query: data.rules.result
    want_result: false

  - note: import_missing_suffix_preserves_undefined
    modules:
      - |
        package lib
        value := true
      - |
        package rules
        import data.lib as alias
        result := alias.missing
    query: data.rules.result
    want_result: "#undefined"

  - note: import_static_cycle_still_errors
    modules:
      - |
        package first
        import data.second
        result if second.result
      - |
        package second
        import data.first
        result if first.result
    query: data.first.result
    want_error: "recurs"

  - note: import_shared_acyclic_rule_dependencies
    modules:
      - |
        package rules
        import data.lib
        result := [lib.left, lib.right]
      - |
        package lib
        left := leaf
        right := leaf
        leaf := 1
    query: data.rules.result
    want_result: [1, 1]

  - note: import_dynamic_suffix_preserves_local_shadowing
    modules:
      - |
        package lib
        value := true
      - |
        package rules
        import data.lib as alias
        result := alias[key] if {
          alias := {"value": false}
          key := "value"
        }
    query: data.rules.result
    want_result: false

  - note: import_suffix_preserves_non_string_index_types
    modules:
      - |
        package lib
        values := [{1: "number", "1": "string", true: "boolean"}]
      - |
        package rules
        import data.lib as alias
        result := [alias.values[0][n], alias.values[0][s], alias.values[0][b]] if {
          n := 1
          s := "1"
          b := true
        }
    query: data.rules.result
    want_result: ["number", "string", "boolean"]

  - note: import_data_inside_rule_body
    modules:
      - |
        package lib
        import rego.v1

        a_value := "a_value"

      - |
        package rules
        import data.lib
        import rego.v1

        sample if {
          lib.a_value == "a_value"
        }
    query: data.rules.sample
    want_result: true
  - note: import_data_alias
    modules:
      - |
        package lib
        import rego.v1

        value := "a_value"

      - |
        package rules
        import data.lib as mylib
        import rego.v1

        sample if {
          mylib.value == "a_value"
        }
    query: data.rules.sample
    want_result: true
  - note: import_nested_package_chain
    modules:
      - |
        package lib.inner
        import rego.v1

        nested := {"key": "value"}

      - |
        package rules
        import data.lib.inner
        import rego.v1

        lookup := value if {
          value := inner.nested.key
        }
    query: data.rules.lookup
    want_result: "value"
  - note: import_alias_shadowed_by_rule
    modules:
      - |
        package lib
        import rego.v1

        value := "from data"

      - |
        package rules
        import data.lib as lib_alias
        import rego.v1

        lib_alias := {"value": "from rule"}

        shadow if {
          lib_alias.value == "from rule"
        }
    query: data.rules.shadow
    want_result: true
  - note: import_used_in_comprehension
    modules:
      - |
        package lib
        import rego.v1

        dataset := {"a", "b"}

      - |
        package rules
        import data.lib
        import rego.v1

        present if {
          some item in lib.dataset
          item == "b"
        }
    query: data.rules.present
    want_result: true
  - note: import_function_call
    modules:
      - |
        package lib
        import rego.v1

        double(x) := 2 * x
      - |
        package rules
        import data.lib
        import rego.v1

        result := lib.double(21)
    query: data.rules.result
    want_result: 42
  - note: import_function_call_alias
    modules:
      - |
        package lib
        import rego.v1

        double(x) := 2 * x
      - |
        package rules
        import data.lib as mylib
        import rego.v1

        result := mylib.double(21)
    query: data.rules.result
    want_result: 42
  - note: import_function_directly
    modules:
      - |
        package lib
        import rego.v1

        double(x) := 2 * x
      - |
        package rules
        import data.lib.double
        import rego.v1

        result := double(21)
    query: data.rules.result
    want_result: 42
  - note: import_function_call_nested_package
    modules:
      - |
        package a.b.c
        import rego.v1

        double(x) := 2 * x
      - |
        package rules
        import data.a
        import rego.v1

        result := a.b.c.double(21)
    query: data.rules.result
    want_result: 42
  - note: import_alias_shadows_builtin_namespace
    modules:
      - |
        package lib
        import rego.v1

        unmarshal(_) := {"from": "lib"}
      - |
        package rules
        import rego.v1
        import data.lib as json

        result := json.unmarshal(`[1,2]`)
    query: data.rules.result
    want_result:
      from: lib
  - note: default_function_value_via_import
    skip: true  # TODO: cross-package calls to functions with default values fail to compile ("not a valid rule path"), even with fully-qualified paths
    modules:
      - |
        package lib
        import rego.v1

        default pick(_) := "fallback"

        pick(x) := x if x == "a"
      - |
        package rules
        import rego.v1
        import data.lib

        a := lib.pick("a")
        b := lib.pick("z")
    query: data.rules
    want_result:
      a: a
      b: fallback
  - note: import_shadows_module_local_rule_for_function_calls
    modules:
      - |
        package lib
        import rego.v1

        double(x) := 2 * x
      - |
        package rules
        import rego.v1
        import data.lib

        lib.double(x) := 100 * x

        main := lib.double(3)
    query: data.rules.main
    want_result: 6
  - note: import_shadows_module_local_value_rule_for_function_calls
    modules:
      - |
        package lib
        import rego.v1

        double(x) := 2 * x
      - |
        package rules
        import rego.v1
        import data.lib

        lib.double := 7

        main := lib.double(3)
    query: data.rules.main
    want_result: 6
  - note: import_fully_qualified_function_call
    modules:
      - |
        package lib
        import rego.v1

        double(x) := 2 * x
      - |
        package rules
        import rego.v1
        import data.lib

        result := data.lib.double(21)
    query: data.rules.result
    want_result: 42
  - note: unknown_function_through_import
    modules:
      - |
        package lib
        import rego.v1

        double(x) := 2 * x
      - |
        package rules
        import rego.v1
        import data.lib

        result := lib.missing(1)
    query: data.rules.result
    want_error: "Unknown function"
  - note: function_call_without_imports
    modules:
      - |
        package rules

        double(x) := 2 * x

        result := double(21)
    query: data.rules.result
    want_result: 42
  - note: non_function_value_rule_through_import
    modules:
      - |
        package lib
        import rego.v1

        x := 5
      - |
        package rules
        import rego.v1
        import data.lib

        result := lib.x(1)
    query: data.rules.result
    want_error: "Unknown function"
  - note: rule_path_prefix_through_import
    modules:
      - |
        package lib
        import rego.v1

        a.c := 9
      - |
        package rules
        import rego.v1
        import data.lib

        result := lib.a(7)
    query: data.rules.result
    want_error: "Unknown function"
