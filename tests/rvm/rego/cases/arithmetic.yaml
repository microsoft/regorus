# Arithmetic Operations Test Suite
# Tests basic arithmetic operations: addition, multiplication, division, subtraction

cases:
  - note: arithmetic_basic
    data: {}
    modules:
      - |
        package test
        main := result if {
          result := 2 + 3
        }
    query: data.test.main
    want_result: 5

  - note: arithmetic_multiply
    data: {}
    modules:
      - |
        package test
        main := result if {
          result := 4 * 6
        }
    query: data.test.main
    want_result: 24

  - note: arithmetic_division
    data: {}
    modules:
      - |
        package test
        main := result if {
          result := 15 / 3
        }
    query: data.test.main
    want_result: 5

  - note: arithmetic_subtraction
    data: {}
    modules:
      - |
        package test
        main := result if {
          result := 10 - 7
        }
    query: data.test.main
    want_result: 3

  # OPA v1.21.2 returns finite values for all four cases by using big.Int or a
  # bounded-precision, wide-exponent big.Float. Regorus deliberately fails closed
  # because its fractional representation is binary64. These errors are a breaking
  # compatibility difference and must stay aligned with the interpreter.
  - note: arithmetic_overflow_addition
    data: {}
    modules:
      - |
        package test
        main := (1e300 * 1e300) + 0.5
    query: data.test.main
    want_error: "numeric overflow in addition"

  - note: arithmetic_overflow_subtraction
    data: {}
    modules:
      - |
        package test
        main := (1e300 * 1e300) - 0.5
    query: data.test.main
    want_error: "numeric overflow in subtraction"

  - note: arithmetic_overflow_multiplication
    data: {}
    modules:
      - |
        package test
        main := (1e300 * 1e300) * 0.0
    query: data.test.main
    want_error: "numeric overflow in multiplication"

  - note: arithmetic_overflow_division
    data: {}
    modules:
      - |
        package test
        main := (1e300 * 1e300) / 7
    query: data.test.main
    want_error: "numeric overflow in division"
