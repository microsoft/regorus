cases:
  - note: runtime_default_blocked_subject
    strict: false
    data: &blocked_bob {blocked: ["bob"]}
    input: &bob {subject: "bob"}
    modules: &blocked_policy
      - |
        package test
        import rego.v1
        default deny := [u | some u in data.blocked; u == input.subject]
        allow if { count(deny) == 0 }
    query: data.test.allow
    want_result: "#undefined"

  - note: runtime_default_blocked_subject_suspendable
    strict: false
    execution_mode: suspendable
    data: *blocked_bob
    input: *bob
    modules: *blocked_policy
    query: data.test.allow
    want_result: "#undefined"

  - note: runtime_default_deny_contains_blocked_subject
    strict: false
    data: *blocked_bob
    input: *bob
    modules: *blocked_policy
    query: data.test.deny
    want_result: ["bob"]

  - note: runtime_default_unblocked_input
    strict: false
    data: *blocked_bob
    input: {subject: "alice"}
    modules: *blocked_policy
    query: data.test.allow
    want_result: true

  - note: runtime_default_unblocked_input_suspendable
    strict: false
    execution_mode: suspendable
    data: *blocked_bob
    input: {subject: "alice"}
    modules: *blocked_policy
    query: data.test.allow
    want_result: true

  - note: runtime_default_unblocked_data
    strict: false
    data: {blocked: ["alice"]}
    input: *bob
    modules: *blocked_policy
    query: data.test.allow
    want_result: true

  # Registered host interception is an RVM extension, not an interpreter/OPA API.
  - note: runtime_default_host_denial_shadows_local_function
    strict: false
    skip_interpreter: true
    data: {}
    input: {}
    modules: &authorize_policy
      - |
        package test
        import rego.v1
        authorize(_) := true
        default checks := [authorize("bob") | true]
        allow if { checks[0] }
    host_await_builtins: &authorize_registration
      - name: authorize
        arg_count: 1
    host_await_responses:
      - id: authorize
        value: false
    query: data.test.allow
    want_result: "#undefined"

  - note: runtime_default_host_denial_shadows_local_function_suspendable
    strict: false
    skip_interpreter: true
    execution_mode: suspendable
    data: {}
    input: {}
    modules: *authorize_policy
    host_await_builtins: *authorize_registration
    host_await_responses:
      - id: authorize
        args: ["bob"]
        value: false
    query: data.test.allow
    want_result: "#undefined"

  - note: runtime_default_host_approval_shadows_local_function
    strict: false
    skip_interpreter: true
    data: {}
    input: {}
    modules: *authorize_policy
    host_await_builtins: *authorize_registration
    host_await_responses:
      - id: authorize
        value: true
    query: data.test.allow
    want_result: true

  - note: runtime_default_host_approval_shadows_local_function_suspendable
    strict: false
    skip_interpreter: true
    execution_mode: suspendable
    data: {}
    input: {}
    modules: *authorize_policy
    host_await_builtins: *authorize_registration
    host_await_responses:
      - id: authorize
        args: ["bob"]
        value: true
    query: data.test.allow
    want_result: true

  - note: runtime_default_without_registration_uses_local_function
    strict: false
    data: {}
    input: {}
    modules: *authorize_policy
    query: data.test.allow
    want_result: true

  - note: conflicting_rules_do_not_consume_default_host_responses
    strict: false
    skip_interpreter: true
    modules:
      - |
        package test
        default p := [lookup("fallback") | true]
        p := 1
        p := 2
        result := lookup("real") if not p
    host_await_builtins:
      - name: lookup
        arg_count: 1
    host_await_responses:
      - id: lookup
        value: false
      - id: lookup
        value: true
    query: data.test.result
    want_result: false

  - note: boolean_intermediate_default_key_is_preserved
    strict: false
    # OPA preserves typed intermediate keys; the interpreter currently loses them.
    skip_interpreter: true
    modules:
      - |
        package test
        default r[true]["x"] := 7
        result := r[true].x
    query: data.test.result
    want_result: 7

  - note: numeric_intermediate_default_key_is_preserved
    strict: false
    skip_interpreter: true
    modules:
      - |
        package test
        default r[3]["x"] := [x | x := input.x]
        result := r[3].x
    input: {x: 8}
    query: data.test.result
    want_result: [8]

  - note: typed_default_namespace_preserves_boolean_layer
    strict: false
    skip_interpreter: true
    execution_mode: suspendable
    modules:
      - |
        package library
        default r[true]["x"] := 7
      - |
        package test
        result := [ns.r[true].x, count(ns.r)] if {
          ns := data.library
        }
    query: data.test.result
    want_result: [7, 1]

  - note: typed_default_namespace_preserves_numeric_layer
    strict: false
    skip_interpreter: true
    modules:
      - |
        package library
        default r[3]["x"] := [x | x := input.x]
      - |
        package test
        result := [ns.r[3].x, count(ns.r)] if {
          ns := data.library
        }
    input: {x: 8}
    query: data.test.result
    want_result: [[8], 1]

  - note: scalar_default_prefixes_do_not_alias_identifier_strings
    strict: false
    skip_interpreter: true
    execution_mode: suspendable
    modules:
      - |
        package test
        default r[true]["x"] := 7
        default s[false]["x"] := 8
        default t[null]["x"] := 9
        result := [
          [v | v := data.test.r["true"].x],
          [v | v := s["false"].x],
          [v | v := data.test.t["null"].x],
          r[true].x,
          s[false].x,
          t[null].x,
        ]
    query: data.test.result
    want_result: [[], [], [], 7, 8, 9]

  - note: boolean_and_string_default_prefixes_preserve_distinct_values
    strict: false
    skip_interpreter: true
    modules:
      - |
        package test
        default r[true]["x"] := 7
        default r["true"]["y"] := [v | v := input.y]
        result := [r[true].x, r["true"].y, count(r)]
    input: {y: 8}
    query: data.test.result
    want_result: [7, [8], 2]
