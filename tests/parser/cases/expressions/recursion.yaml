cases:
  - note: deep-parens-over-limit
    rego: |
      package test
      x = ((((((((((((((((((((((((((((((((1))))))))))))))))))))))))))))))))
    error: "expression nesting too deep"

  - note: compr-mixed-deep
    rego: |
      package test
      x = (1 + ( 2 + ( 3 + ( 4 + ((((((( [ [ 1 + (2 + ((((((((((((((((((((1))))))))))))))))))))) | true ] | true ] )))))))))))))
    error: "expression nesting too deep"

  - note: deep-arrays-at-limit
    rego: |
      package test
      x = [[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[1]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]
    num_expressions: 34
    num_statements: 0
    num_queries: 0

  - note: deep-arrays-over-limit
    rego: |
      package test
      x = [[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[[1]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]]
    error: "expression nesting too deep (>32)"

  - note: deep-calls-at-limit
    rego: |
      package test
      x = count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(1)))))))))))))))))))))))))))))))
    num_expressions: 65
    num_statements: 0
    num_queries: 0

  - note: deep-calls-over-limit
    rego: |
      package test
      x = count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(count(1))))))))))))))))))))))))))))))))
    error: "expression nesting too deep (>32)"

  - note: deep-set-lookahead-over-limit
    rego: |
      package test
      x = set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set(set()))))))))))))))))))))))))))))))))
    error: "expression nesting too deep (>32)"

  - note: deep-every-over-limit
    rego: |
      package test
      import rego.v1
      x if {
        every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] {
        every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] {
        every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] {
        every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] { every a in [1] {
          true
        } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } } }
      }
    error: "expression nesting too deep (>32)"

  - note: multiline-unary-unification-and-parens-string-call
    rego: |
      package test
      x = y {
        -
        1 = -1
        f[("k")](1) = y
      }
    num_expressions: 14
    num_statements: 2
    num_queries: 1
