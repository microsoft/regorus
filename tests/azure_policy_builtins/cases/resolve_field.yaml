# Tests for azure.policy.resolve_field
builtin: azure.policy.resolve_field

cases:
  - note: simple_field
    args:
      - name: "myResource"
        type: "Microsoft.Compute/virtualMachines"
      - "name"
    want: "myResource"

  - note: nested_field_with_dot_path
    args:
      - properties:
          securityRules:
            enabled: true
      - "properties.securityRules.enabled"
    want: true

  - note: missing_field
    args:
      - name: "myResource"
      - "nonExistent"
    want_undefined: true

  - note: deeply_nested
    args:
      - a:
          b:
            c:
              d: "deep"
      - "a.b.c.d"
    want: "deep"

  - note: top_level_type
    args:
      - type: "Microsoft.Storage/storageAccounts"
        kind: "StorageV2"
      - "type"
    want: "Microsoft.Storage/storageAccounts"

  - note: non_string_path
    args:
      - name: "test"
      - 42
    want_undefined: true

  - note: empty_normalized_tag_bracket_does_not_resolve_parent
    args:
      - tags:
          env: "production"
          "": "empty"
      - "tags[ ]"
    want_undefined: true

  - note: unclosed_tag_bracket_does_not_resolve_parent
    args:
      - tags:
          env: "production"
      - "tags[env"
    want_undefined: true

  - note: empty_quoted_tag_bracket_does_not_resolve_parent
    args:
      - tags:
          env: "production"
          "": "empty"
      - "tags[ '' ]"
    want_undefined: true

  - note: quoted_space_tag_is_not_empty
    args:
      - tags:
          " ": "production"
      - "tags[ ' ' ]"
    want: "production"

  - note: quoted_space_tag_twin_does_not_match_unquoted_key
    args:
      - tags:
          env: "production"
      - "tags[ ' ' ]"
    want_undefined: true
