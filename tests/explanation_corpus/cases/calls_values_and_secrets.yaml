# Helper rules and functions across packages, `with`, builtins, Undefined
# versus false versus empty values, runtime errors and sensitive values.

cases:
  - note: helper_rules_or
    description: A rule that combines two helper rules in separate definitions.
    constructs: [helper_rule, multiple_bodies, unknown_input]
    unknowns: [input.user, input.resource]
    modules:
      - |
        package test
        is_admin if input.user.role == "admin"
        is_owner if input.user.name == input.resource.owner
        allow if is_admin
        allow if is_owner
    query: data.test.allow
    examples:
      - note: via_admin
        input: {user: {role: admin, name: a}, resource: {owner: b}}
        want_result: true
      - note: via_owner
        input: {user: {role: dev, name: b}, resource: {owner: b}}
        want_result: true
      - note: neither
        input: {user: {role: dev, name: a}, resource: {owner: b}}
        want_result: "#undefined"

  - note: helper_function_other_package
    description: A partial set using a negated function imported from another package.
    constructs: [helper_rule, function, negation, builtin, partial_set, unknown_input]
    unknowns: [input.images]
    modules:
      - |
        package lib
        trusted(img) if startswith(img, "registry.example.com/")
      - |
        package test
        import data.lib
        deny contains img if {
          some img in input.images
          not lib.trusted(img)
        }
    query: data.test.deny
    examples:
      - note: one_untrusted
        input: {images: ["registry.example.com/a", "docker.io/b"]}
        want_result: {"set!": ["docker.io/b"]}
      - note: all_trusted
        input: {images: ["registry.example.com/a"]}
        want_result: {"set!": []}

  - note: helper_rule_value_chain
    description: A rule whose value comes from a chain of helper rules and data.
    constructs: [helper_rule, complete_rule, default, unknown_input]
    unknowns: [input.account, input.usage]
    data:
      quotas: {gold: 100, silver: 10}
    modules:
      - |
        package test
        tier := input.account.tier
        quota := data.quotas[tier]
        default within_quota := false
        within_quota if input.usage <= quota
    query: data.test.within_quota
    examples:
      - note: within
        input: {account: {tier: silver}, usage: 5}
        want_result: true
      - note: over
        input: {account: {tier: silver}, usage: 50}
        want_result: false
      - note: unknown_tier
        input: {account: {tier: bronze}, usage: 1}
        want_result: false

  - note: with_input_override
    description: A helper rule evaluated with an overridden input value.
    constructs: [with, helper_rule]
    modules:
      - |
        package test
        large if input.amount > 100
        large_after_scaling if large with input.amount as input.amount * 10
    query: data.test.large_after_scaling
    examples:
      - note: override_makes_it_match
        input: {amount: 20}
        want_result: true
        divergence:
          reason: The RVM compiler does not support `with` yet.
          engines: [rvm]
          actual_error: "`with` keyword is not supported"
      - note: override_still_fails
        input: {amount: 5}
        want_result: "#undefined"
        divergence:
          reason: The RVM compiler does not support `with` yet.
          engines: [rvm]
          actual_error: "`with` keyword is not supported"

  - note: with_data_override
    description: A rule evaluated with an overridden data value.
    constructs: [with, helper_rule, default]
    data:
      limits: {max: 100}
    modules:
      - |
        package test
        default over := false
        over if input.amount > data.limits.max
        over_strict if over with data.limits.max as 10
    query: data.test.over_strict
    examples:
      - note: override_makes_it_match
        input: {amount: 50}
        want_result: true
        divergence:
          reason: The RVM compiler does not support `with` yet.
          engines: [rvm]
          actual_error: "`with` keyword is not supported"
      - note: override_still_fails
        input: {amount: 5}
        want_result: "#undefined"
        divergence:
          reason: The RVM compiler does not support `with` yet.
          engines: [rvm]
          actual_error: "`with` keyword is not supported"

  - note: builtins_in_conditions
    description: String and numeric builtins in rule conditions.
    constructs: [builtin, complete_rule, unknown_input]
    unknowns: [input.email, input.name]
    modules:
      - |
        package test
        valid if {
          endswith(lower(input.email), "@example.com")
          count(trim_space(input.name)) > 0
        }
    query: data.test.valid
    examples:
      - note: valid
        input: {email: "Alice@Example.com", name: " Alice "}
        want_result: true
      - note: bad_email
        input: {email: "alice@other.com", name: Alice}
        want_result: "#undefined"
      - note: blank_name
        input: {email: "alice@example.com", name: "   "}
        want_result: "#undefined"

  - note: undefined_false_empty_values
    description: A rule value that can be true, false, an empty array or Undefined.
    constructs: [undefined_vs_false, complete_rule]
    modules:
      - |
        package test
        flag := input.flag
    query: data.test.flag
    examples:
      - note: true_value
        input: {flag: true}
        want_result: true
      - note: false_value
        input: {flag: false}
        want_result: false
      - note: empty_value
        input: {flag: []}
        want_result: []
      - note: null_value
        input: {flag: null}
        want_result: null
      - note: missing
        input: {}
        want_result: "#undefined"

  - note: comparison_value_false_vs_undefined
    description: A comparison assigned to a rule is false, not Undefined, when it fails.
    constructs: [undefined_vs_false, complete_rule]
    modules:
      - |
        package test
        is_prod := input.env == "prod"
    query: data.test.is_prod
    examples:
      - note: equal
        input: {env: prod}
        want_result: true
      - note: not_equal
        input: {env: dev}
        want_result: false
      - note: operand_missing
        input: {}
        want_result: "#undefined"

  - note: runtime_error_complete_conflict
    description: A complete rule with two definitions that succeed with different values.
    constructs: [conflict, runtime_error, complete_rule]
    modules:
      - |
        package test
        mode := "strict" if input.strict
        mode := "lenient" if input.lenient
    query: data.test.mode
    examples:
      - note: one_definition
        input: {strict: true}
        want_result: strict
      - note: both_definitions
        input: {strict: true, lenient: true}
        want_error: "conflicts"
        divergence:
          reason: The RVM returns Undefined instead of a conflict error when definitions disagree.
          engines: [rvm]
          actual_result: "#undefined"

  - note: secret_in_data
    description: A token check against a secret held in data.
    constructs: [secret, default, complete_rule, unknown_input]
    unknowns: [input.request]
    secrets: ["s3cr3t-t0ken"]
    data:
      secrets: {api_token: "s3cr3t-t0ken"}
    modules:
      - |
        package test
        default allow := false
        allow if input.request.token == data.secrets.api_token
    query: data.test.allow
    examples:
      - note: token_matches
        input: {request: {token: "s3cr3t-t0ken"}}
        want_result: true
      - note: token_differs
        input: {request: {token: "guess"}}
        want_result: false

  - note: secret_in_dependency_result
    description: A dependency rule whose result is a secret taken from input.
    constructs: [secret, helper_rule, builtin]
    secrets: ["Bearer hunter2", "Bearer wrong"]
    modules:
      - |
        package test
        auth_header := input.headers.authorization
        allow if {
          startswith(auth_header, "Bearer ")
          auth_header == "Bearer hunter2"
        }
    query: data.test.allow
    examples:
      - note: matches
        input: {headers: {authorization: "Bearer hunter2"}}
        want_result: true
      - note: differs
        input: {headers: {authorization: "Bearer wrong"}}
        want_result: "#undefined"

  - note: secret_in_loop
    description: A loop over input records with a sensitive field.
    constructs: [secret, some_in, partial_set, builtin]
    secrets: ["hunter2", "correct-horse-battery-staple"]
    modules:
      - |
        package test
        weak contains user.name if {
          some user in input.users
          count(user.password) < 12
        }
    query: data.test.weak
    examples:
      - note: one_weak
        input:
          users:
            - {name: alice, password: "hunter2"}
            - {name: bob, password: "correct-horse-battery-staple"}
        want_result: {"set!": [alice]}
      - note: none_weak
        input:
          users:
            - {name: bob, password: "correct-horse-battery-staple"}
        want_result: {"set!": []}

  - note: whole_input_unknown
    description: A rule over several input fields with all of input unknown.
    constructs: [unknown_input, complete_rule, negation, membership]
    unknowns: [input]
    data:
      regions: [eu, us]
    modules:
      - |
        package test
        allow if {
          input.region in data.regions
          input.size <= 10
          not input.deprecated
        }
    query: data.test.allow
    examples:
      - note: all_conditions_hold
        input: {region: eu, size: 3}
        want_result: true
      - note: region_not_allowed
        input: {region: ap, size: 3}
        want_result: "#undefined"
      - note: deprecated
        input: {region: us, size: 3, deprecated: true}
        want_result: "#undefined"
      - note: too_large
        input: {region: us, size: 30}
        want_result: "#undefined"

  - note: runtime_error_builtin_operand
    description: A builtin applied to an operand of the wrong type, which is an error rather than Undefined.
    constructs: [runtime_error, builtin, complete_rule]
    strict_builtin_errors: true
    modules:
      - |
        package test
        item_count := count(input.items)
    query: data.test.item_count
    examples:
      - note: valid_operand
        input: {items: [a, b]}
        want_result: 2
      - note: wrong_type
        input: {items: 5}
        want_error: "requires array/object/set/string"
        divergence:
          reason: The RVM returns Undefined instead of an error for a failing builtin call, even in strict mode.
          engines: [rvm]
          actual_result: "#undefined"
      - note: missing_operand
        input: {}
        want_result: "#undefined"

  - note: runtime_error_in_helper_function
    description: A division by zero inside a helper function called from a rule body.
    constructs: [runtime_error, function, helper_rule]
    strict_builtin_errors: true
    modules:
      - |
        package test
        ratio(a, b) := a / b
        balanced if ratio(input.used, input.total) < 0.5
    query: data.test.balanced
    examples:
      - note: below
        input: {used: 1, total: 4}
        want_result: true
      - note: above
        input: {used: 3, total: 4}
        want_result: "#undefined"
      - note: division_by_zero
        input: {used: 1, total: 0}
        want_error: "by zero"
        divergence:
          reason: The RVM returns Undefined instead of an error for a failing builtin call, even in strict mode.
          engines: [rvm]
          actual_result: "#undefined"

  - note: builtin_error_non_strict
    description: Without strict builtin errors, a builtin error makes the expression Undefined.
    constructs: [runtime_error, builtin, default, undefined_vs_false]
    modules:
      - |
        package test
        default small := false
        small if count(input.items) < 3
    query: data.test.small
    examples:
      - note: valid_operand
        input: {items: [a]}
        want_result: true
      - note: valid_operand_too_large
        input: {items: [a, b, c]}
        want_result: false
      - note: wrong_type
        input: {items: 5}
        want_result: false

  - note: input_document_presence
    description: An absent input document is Undefined, which differs from a null or empty input.
    constructs: [undefined_vs_false, default, multiple_bodies, builtin]
    modules:
      - |
        package test
        default kind := "absent"
        kind := "null" if input == null
        kind := "object" if is_object(input)
    query: data.test.kind
    examples:
      - note: absent
        want_result: absent
      - note: null_input
        input: null
        want_result: "null"
      - note: empty_object
        input: {}
        want_result: object

  - note: object_get_with_default
    description: A lookup that falls back to a default value when the path is missing.
    constructs: [builtin, undefined_vs_false, unknown_input]
    unknowns: [input.config]
    modules:
      - |
        package test
        region := object.get(input, ["config", "region"], "us-east")
    query: data.test.region
    examples:
      - note: region_set
        input: {config: {region: eu-west}}
        want_result: eu-west
      - note: missing_region_uses_default
        input: {config: {}}
        want_result: us-east
      - note: missing_config_uses_default
        input: {}
        want_result: us-east

  - note: cross_package_rule_reference
    description: A rule that depends on a complete rule defined in another package.
    constructs: [helper_rule, complete_rule, default, unknown_input]
    unknowns: [input.user]
    modules:
      - |
        package lib
        is_admin if input.user.role == "admin"
      - |
        package test
        default allow := false
        allow if data.lib.is_admin
    query: data.test.allow
    examples:
      - note: admin
        input: {user: {role: admin}}
        want_result: true
      - note: not_admin
        input: {user: {role: dev}}
        want_result: false
      - note: no_user
        input: {}
        want_result: false
