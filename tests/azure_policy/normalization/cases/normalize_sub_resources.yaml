                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input:
      type: "Test/widgets"
      properties:
        x:
          - y:
              - name: one
                properties:
                  z: 1
              - name: two
                properties:
                  z: 2
    expected_normalized:
      type: "Test/widgets"
      x:
        - y:
            - name: one
              z: 1
            - name: two
              z: 2
    round_trip: true

