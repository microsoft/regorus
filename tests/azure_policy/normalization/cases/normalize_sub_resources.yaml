        a:
          b:
            - name: inner
              properties:
                z: 1
    expected_normalized:
      type: "Test/widgets"
      a:
        b:
          - name: inner
            z: 1
    round_trip: true

  - note: top-level array sharing a nested sub-resource array's name is not flattened
    aliases_json: |
      [
        {
          "namespace": "Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test/widgets/x[*].y[*].z",
                  "defaultPath": "properties.x[*].y[*].properties.z",
                  "paths": []
                },
                {
                  "name": "Test/widgets/y[*].foo",
                  "defaultPath": "properties.y[*].foo",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input:
      type: "Test/widgets"
      properties:
        x:
          - y:
              - properties:
                  z: 1
        y:
          - foo: 1
            properties:
              keep: true
    expected_normalized:
      type: "Test/widgets"
      x:
        - y:
            - z: 1
      y:
        - foo: 1
          properties:
            keep: true
    round_trip: true

  - note: plain alias for the unwrapped outer array keeps the nested flattening
