cases:
  - note: flattens sub-resource arrays
    input:
      name: myNsg
      type: "Microsoft.Network/networkSecurityGroups"
      properties:
        securityRules:
          - name: rule1
            properties:
              protocol: Tcp
              access: Allow
          - name: rule2
            properties:
              protocol: "*"
              access: Deny
    sub_resource_arrays: ["securityRules"]
    resource_type: "Microsoft.Network/networkSecurityGroups"
    expected_normalized:
      name: myNsg
      type: "Microsoft.Network/networkSecurityGroups"
      securityrules:
        - name: rule1
          protocol: Tcp
          access: Allow
        - name: rule2
          protocol: "*"
          access: Deny
    round_trip: true
    expected_round_trip:
      name: myNsg
      type: "Microsoft.Network/networkSecurityGroups"
      properties:
        securityrules:
          - name: rule1
            properties:
              protocol: Tcp
              access: Allow
          - name: rule2
            properties:
              protocol: "*"
              access: Deny

  - note: nested sub-resource arrays
    input:
      name: myVnet
      properties:
        subnets:
          - name: subnet1
            properties:
              addressPrefix: "10.0.0.0/24"
              ipConfigurations:
                - name: ipconfig1
                  properties:
                    privateIPAddress: "10.0.0.4"
    sub_resource_arrays: ["subnets", "subnets.ipConfigurations"]
    resource_type: "Microsoft.Network/virtualNetworks"
    expected_normalized:
      name: myVnet
      subnets:
        - name: subnet1
          addressprefix: "10.0.0.0/24"
          ipconfigurations:
            - name: ipconfig1
              privateipaddress: "10.0.0.4"
    round_trip: true
    expected_round_trip:
      name: myVnet
      properties:
        subnets:
          - name: subnet1
            properties:
              addressprefix: "10.0.0.0/24"
              ipconfigurations:
                - name: ipconfig1
                  properties:
                    privateipaddress: "10.0.0.4"

  - note: sub-resource element without properties
    input:
      name: test
      properties:
        items:
          - name: plain-object
            enabled: true
    sub_resource_arrays: ["items"]
    resource_type: test
    expected_normalized:
      name: test
      items:
        - name: plain-object
          enabled: true
    round_trip: true
    expected_round_trip:
      name: test
      properties:
        items:
          - name: plain-object
            properties:
              enabled: true

  - note: case-insensitive sub-resource match
    input:
      name: test
      properties:
        securityRules:
          - name: r1
            properties:
              protocol: Tcp
    sub_resource_arrays: ["SecurityRules"]
    resource_type: test
    expected_normalized:
      name: test
      securityrules:
        - name: r1
          protocol: Tcp
    round_trip: true
    expected_round_trip:
      name: test
      properties:
        securityrules:
          - name: r1
            properties:
              protocol: Tcp

  - note: sub-resource array nested under an unwrapped array
    aliases_json: |
      [
        {
          "namespace": "Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test/widgets/x[*].y[*].z",
                  "defaultPath": "properties.x[*].y[*].properties.z",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input:
      type: "Test/widgets"
      properties:
        x:
          - y:
              - name: inner
                properties:
                  z: 1
    expected_normalized:
      type: "Test/widgets"
      x:
        - y:
            - name: inner
              z: 1
    round_trip: true

  - note: sub-resource array under a multi-key unwrapped array level
    aliases_json: |
      [
        {
          "namespace": "Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test/widgets/a.b[*].c[*].z",
                  "defaultPath": "properties.a.b[*].c[*].properties.z",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input:
      type: "Test/widgets"
      properties:
        a:
          b:
            - c:
                - name: inner
                  properties:
                    z: 1
    expected_normalized:
      type: "Test/widgets"
      a:
        b:
          - c:
              - name: inner
                z: 1
    round_trip: true

  - note: sub-resource array reached through an object inside an array element
    aliases_json: |
      [
        {
          "namespace": "Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test/widgets/x[*].config.y[*].z",
                  "defaultPath": "properties.x[*].config.y[*].properties.z",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input:
      type: "Test/widgets"
      properties:
        x:
          - config:
              y:
                - name: inner
                  properties:
                    z: 1
    expected_normalized:
      type: "Test/widgets"
      x:
        - config:
            y:
              - name: inner
                z: 1
    round_trip: true

  - note: wrapped sub-resource array with a multi-key name
    aliases_json: |
      [
        {
          "namespace": "Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test/widgets/a.b[*].z",
                  "defaultPath": "properties.a.b[*].properties.z",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input:
      type: "Test/widgets"
      properties:
        a:
          b:
            - name: inner
              properties:
                z: 1
    expected_normalized:
      type: "Test/widgets"
      a:
        b:
          - name: inner
            z: 1
    round_trip: true

  - note: top-level array sharing a nested sub-resource array's name is not flattened
    aliases_json: |
      [
        {
          "namespace": "Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test/widgets/x[*].y[*].z",
                  "defaultPath": "properties.x[*].y[*].properties.z",
                  "paths": []
                },
                {
                  "name": "Test/widgets/y[*].foo",
                  "defaultPath": "properties.y[*].foo",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input:
      type: "Test/widgets"
      properties:
        x:
          - y:
              - properties:
                  z: 1
        y:
          - foo: 1
            properties:
              keep: true
    expected_normalized:
      type: "Test/widgets"
      x:
        - y:
            - z: 1
      y:
        - foo: 1
          properties:
            keep: true
    round_trip: true

  - note: plain alias for the unwrapped outer array keeps the nested flattening
    aliases_json: |
      [
        {
          "namespace": "Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test/widgets/x",
                  "defaultPath": "properties.x",
                  "paths": []
                },
                {
                  "name": "Test/widgets/x[*].y[*].z",
                  "defaultPath": "properties.x[*].y[*].properties.z",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input:
      type: "Test/widgets"
      properties:
        x:
          - y:
              - name: one
                properties:
                  z: 1
              - name: two
                properties:
                  z: 2
    expected_normalized:
      type: "Test/widgets"
      x:
        - y:
            - name: one
              z: 1
            - name: two
              z: 2
    round_trip: true
