aliases_json: |
  [
    {
      "namespace": "Microsoft.Storage",
      "resourceTypes": [
        {
          "resourceType": "storageAccounts",
          "aliases": [
            {
              "name": "Microsoft.Storage/storageAccounts/supportsHttpsTrafficOnly",
              "defaultPath": "properties.supportsHttpsTrafficOnly",
              "paths": []
            },
            {
              "name": "Microsoft.Storage/storageAccounts/accessTier",
              "defaultPath": "properties.accessTier",
              "paths": []
            },
            {
              "name": "Microsoft.Storage/storageAccounts/sku.name",
              "defaultPath": "sku.name",
              "paths": []
            }
          ]
        }
      ]
    },
    {
      "namespace": "Microsoft.Network",
      "resourceTypes": [
        {
          "resourceType": "networkSecurityGroups",
          "aliases": [
            {
              "name": "Microsoft.Network/networkSecurityGroups/securityRules[*].protocol",
              "defaultPath": "properties.securityRules[*].properties.protocol",
              "paths": []
            },
            {
              "name": "Microsoft.Network/networkSecurityGroups/securityRules[*].access",
              "defaultPath": "properties.securityRules[*].properties.access",
              "paths": []
            },
            {
              "name": "Microsoft.Network/networkSecurityGroups/securityRules[*].name",
              "defaultPath": "properties.securityRules[*].name",
              "paths": []
            }
          ]
        },
        {
          "resourceType": "virtualNetworks",
          "aliases": [
            {
              "name": "Microsoft.Network/virtualNetworks/subnets[*].addressPrefix",
              "defaultPath": "properties.subnets[*].properties.addressPrefix",
              "paths": []
            },
            {
              "name": "Microsoft.Network/virtualNetworks/subnets[*].name",
              "defaultPath": "properties.subnets[*].name",
              "paths": []
            },
            {
              "name": "Microsoft.Network/virtualNetworks/subnets[*].ipConfigurations[*].privateIPAddress",
              "defaultPath": "properties.subnets[*].properties.ipConfigurations[*].properties.privateIPAddress",
              "paths": []
            },
            {
              "name": "Microsoft.Network/virtualNetworks/subnets[*].ipConfigurations[*].name",
              "defaultPath": "properties.subnets[*].properties.ipConfigurations[*].name",
              "paths": []
            }
          ]
        }
      ]
    },
    {
      "namespace": "Microsoft.Web",
      "resourceTypes": [
        {
          "resourceType": "sites",
          "aliases": [
            {
              "name": "Microsoft.Web/sites/isEnabled",
              "defaultPath": "properties.isEnabled",
              "paths": [
                {
                  "path": "properties.enabled",
                  "apiVersions": ["2020-01-01"]
                }
              ]
            }
          ]
        }
      ]
    },
    {
      "namespace": "test",
      "resourceTypes": [
        {
          "resourceType": "resource",
          "aliases": [
            {
              "name": "test/resource/type",
              "defaultPath": "properties.type",
              "paths": []
            }
          ]
        },
        {
          "resourceType": "versionedEnvelope",
          "aliases": [
            {
              "name": "test/versionedEnvelope/items[*].status",
              "defaultPath": "properties.items[*].properties.status",
              "paths": [
                {
                  "path": "properties.items[*].status",
                  "apiVersions": ["2025-01-01"]
                }
              ]
            },
            {
              "name": "test/versionedEnvelope/items[*].name",
              "defaultPath": "properties.items[*].name",
              "paths": []
            }
          ]
        }
      ]
    }
  ]

cases:
  - note: restores casing from aliases
    input:
      name: myStorage
      type: "Microsoft.Storage/storageAccounts"
      supportshttpstrafficonly: true
      accesstier: Hot
    expected_denormalized:
      name: myStorage
      type: "Microsoft.Storage/storageAccounts"
      properties:
        supportsHttpsTrafficOnly: true
        accessTier: Hot
    reverse_round_trip: true

  - note: versioned path - default
    input:
      type: "Microsoft.Web/sites"
      isenabled: true
    expected_denormalized:
      type: "Microsoft.Web/sites"
      properties:
        isEnabled: true
    reverse_round_trip: true

  - note: versioned path - matching version
    input:
      type: "Microsoft.Web/sites"
      isenabled: true
    api_version: "2020-01-01"
    expected_denormalized:
      type: "Microsoft.Web/sites"
      properties:
        enabled: true
    reverse_round_trip: true
    expected_reverse_round_trip:
      type: "Microsoft.Web/sites"
      enabled: true
      isenabled: true

  - note: collision safe key
    input:
      type: "test/resource"
      _p_type: SubType
    expected_denormalized:
      type: "test/resource"
      properties:
        type: SubType
    reverse_round_trip: true

  - note: sub-resource array
    input:
      name: myNsg
      type: "Microsoft.Network/networkSecurityGroups"
      securityrules:
        - name: rule1
          protocol: Tcp
          access: Allow
        - name: rule2
          protocol: "*"
          access: Deny
    expected_denormalized:
      name: myNsg
      type: "Microsoft.Network/networkSecurityGroups"
      properties:
        securityRules:
          - name: rule1
            properties:
              protocol: Tcp
              access: Allow
          - name: rule2
            properties:
              protocol: "*"
              access: Deny
    reverse_round_trip: true

  - note: nested sub-resource arrays
    input:
      name: myVnet
      type: "Microsoft.Network/virtualNetworks"
      subnets:
        - name: subnet1
          addressprefix: "10.0.0.0/24"
          ipconfigurations:
            - name: ipconfig1
              privateipaddress: "10.0.0.4"
    expected_denormalized:
      name: myVnet
      type: "Microsoft.Network/virtualNetworks"
      properties:
        subnets:
          - name: subnet1
            properties:
              addressPrefix: "10.0.0.0/24"
              ipConfigurations:
                - name: ipconfig1
                  properties:
                    privateIPAddress: "10.0.0.4"
    reverse_round_trip: true

  - note: root level alias (sku.name)
    input:
      type: "Microsoft.Storage/storageAccounts"
      sku:
        name: Standard_LRS
    expected_denormalized:
      type: "Microsoft.Storage/storageAccounts"
      sku:
        name: Standard_LRS
    reverse_round_trip: true

  - note: versioned envelope classification — default (status under properties)
    resource_type: "test/versionedEnvelope"
    sub_resource_arrays: ["items"]
    input:
      type: "test/versionedEnvelope"
      items:
        - name: item1
          status: active
    expected_denormalized:
      type: "test/versionedEnvelope"
      properties:
        items:
          - name: item1
            properties:
              status: active

  - note: versioned envelope classification — version promotes status to envelope
    resource_type: "test/versionedEnvelope"
    sub_resource_arrays: ["items"]
    api_version: "2025-01-01"
    input:
      type: "test/versionedEnvelope"
      items:
        - name: item1
          status: active
    expected_denormalized:
      type: "test/versionedEnvelope"
      properties:
        items:
          - name: item1
            status: active

  - note: versioned casing restoration from versioned alias paths
    aliases_json: |
      [
        {
          "namespace": "Microsoft.Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Microsoft.Test/widgets/items[*].rating",
                  "defaultPath": "properties.items[*].properties.oldField",
                  "paths": [
                    {
                      "path": "properties.items[*].properties.RenamedField",
                      "apiVersions": ["2025-06-01"]
                    }
                  ]
                },
                {
                  "name": "Microsoft.Test/widgets/items[*].name",
                  "defaultPath": "properties.items[*].name",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    api_version: "2025-06-01"
    input:
      type: "Microsoft.Test/widgets"
      items:
        - name: w1
          rating: 5
    expected_denormalized:
      type: "Microsoft.Test/widgets"
      properties:
        items:
          - name: w1
            properties:
              RenamedField: 5

  - note: reverse element remap under a mixed-case array
    aliases_json: |
      [
        {
          "namespace": "Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test/widgets/Rules[*].x",
                  "defaultPath": "properties.Rules[*].y",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input: {"type": "Test/widgets", "rules": [{"x": 1}, {"x": 2}]}
    expected_denormalized: {"type": "Test/widgets", "properties": {"Rules": [{"y": 1}, {"y": 2}]}}
    reverse_round_trip: true

  - note: reverse element remap under a mixed-case array behind an object prefix
    aliases_json: |
      [
        {
          "namespace": "Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test/widgets/a.Rules[*].x",
                  "defaultPath": "properties.a.Rules[*].y",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input: {"type": "Test/widgets", "a": {"rules": [{"x": 1}]}}
    expected_denormalized: {"type": "Test/widgets", "properties": {"a": {"Rules": [{"y": 1}]}}}
    reverse_round_trip: true

  - note: reverse element remap through nested mixed-case arrays
    aliases_json: |
      [
        {
          "namespace": "Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test/widgets/Outer[*].Inner[*].x",
                  "defaultPath": "properties.Outer[*].Inner[*].y",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input: {"type": "Test/widgets", "outer": [{"inner": [{"x": 1}]}]}
    expected_denormalized: {"type": "Test/widgets", "properties": {"Outer": [{"Inner": [{"y": 1}]}]}}
    reverse_round_trip: true

  - note: reverse element remap in a flattened mixed-case sub-resource array
    aliases_json: |
      [
        {
          "namespace": "Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test/widgets/securityRules[*].x",
                  "defaultPath": "properties.securityRules[*].properties.y",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input: {"type": "Test/widgets", "securityrules": [{"name": "r", "x": 1}]}
    expected_denormalized: {"type": "Test/widgets", "properties": {"securityRules": [{"name": "r", "properties": {"y": 1}}]}}
    reverse_round_trip: true

  - note: reverse element remap with a mixed-case source leaf
    aliases_json: |
      [
        {
          "namespace": "Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test/widgets/Rules[*].SrcLeaf",
                  "defaultPath": "properties.Rules[*].dst",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input: {"type": "Test/widgets", "rules": [{"srcleaf": 1}]}
    expected_denormalized: {"type": "Test/widgets", "properties": {"Rules": [{"dst": 1}]}}
    reverse_round_trip: true

  - note: Front Door routing rule fields move under routeConfiguration
    aliases_json: |
      [
        {
          "namespace": "Microsoft.Network",
          "resourceTypes": [
            {
              "resourceType": "frontDoors",
              "aliases": [
                {
                  "name": "Microsoft.Network/frontDoors/routingRules[*].forwardingProtocol",
                  "defaultPath": "properties.routingRules[*].properties.routeConfiguration.forwardingProtocol",
                  "paths": []
                },
                {
                  "name": "Microsoft.Network/frontDoors/routingRules[*].name",
                  "defaultPath": "properties.routingRules[*].name",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input: {"type": "Microsoft.Network/frontDoors", "routingrules": [{"name": "r1", "forwardingprotocol": "HttpsOnly"}]}
    expected_denormalized: {"type": "Microsoft.Network/frontDoors", "properties": {"routingRules": [{"name": "r1", "properties": {"routeConfiguration": {"forwardingProtocol": "HttpsOnly"}}}]}}
    reverse_round_trip: true
    # Normalizing back leaves an empty `routeconfiguration` until element
    # remaps prune emptied parents.
    expected_reverse_round_trip: {"type": "Microsoft.Network/frontDoors", "routingrules": [{"name": "r1", "forwardingprotocol": "HttpsOnly", "routeconfiguration": {}}]}

  - note: reverse element remap whose ARM leaf nests under the alias leaf
    aliases_json: |
      [
        {
          "namespace": "Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test/widgets/Rules[*].Cfg",
                  "defaultPath": "properties.Rules[*].Cfg.value",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input: {"type": "Test/widgets", "rules": [{"cfg": 1}]}
    expected_denormalized: {"type": "Test/widgets", "properties": {"Rules": [{"Cfg": {"value": 1}}]}}
    reverse_round_trip: true

  - note: reverse element remap with a mixed-case dotted source
    aliases_json: |
      [
        {
          "namespace": "Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test/widgets/Rules[*].Cfg.Mode",
                  "defaultPath": "properties.Rules[*].level",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input: {"type": "Test/widgets", "rules": [{"cfg": {"mode": 1}}]}
    # The emptied `Cfg` object stays until element remaps prune emptied parents.
    expected_denormalized: {"type": "Test/widgets", "properties": {"Rules": [{"Cfg": {}, "level": 1}]}}

  - note: reverse element remap through an object prefix inside a mixed-case array
    aliases_json: |
      [
        {
          "namespace": "Test",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test/widgets/Outer[*].Mid.Inner[*].x",
                  "defaultPath": "properties.Outer[*].Mid.Inner[*].y",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input: {"type": "Test/widgets", "outer": [{"mid": {"inner": [{"x": 1}]}}]}
    expected_denormalized: {"type": "Test/widgets", "properties": {"Outer": [{"Mid": {"Inner": [{"y": 1}]}}]}}
    reverse_round_trip: true
