# Sub-resource arrays in data-plane resources, whose non-aliased fields sit
# at the resource root rather than under `properties`.

data_manifest_json: |
  {
    "dataNamespace": "Test.Data",
    "aliases": [],
    "resourceTypeAliases": [
      {
        "resourceType": "widgets",
        "aliases": [
          {
            "name": "Test.Data/widgets/v[*].state",
            "paths": [
              {
                "path": "properties.other[*].rawstate",
                "apiVersions": ["1.0"]
              }
            ]
          },
          {
            "name": "Test.Data/widgets/x[*].y[*].z",
            "paths": [
              {
                "path": "x[*].y[*].properties.z",
                "apiVersions": ["1.0"]
              }
            ]
          }
        ]
      }
    ]
  }

cases:
  - note: root-level outer array without a plain alias keeps the nested wrappers
    input:
      type: "Test.Data/widgets"
      x:
        - y:
            - name: one
              properties:
                z: 1
    expected_normalized:
      type: "Test.Data/widgets"
      x:
        - y:
            - name: one
              z: 1
    round_trip: true

  - note: a reverse remap leaves a root-level array of the same name alone
    input:
      type: "Test.Data/widgets"
      v:
        - state: s
    round_trip: true

  - note: root-level outer array without a plain alias gets its renamed leaf back
    aliases_json: |
      [
        {
          "namespace": "Test.Data",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test.Data/widgets/x[*].y[*].z",
                  "defaultPath": "x[*].y[*].properties.rawz",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input:
      type: "Test.Data/widgets"
      x:
        - y:
            - name: one
              properties:
                rawz: 1
    round_trip: true

  - note: a quoted properties wrapper keeps a reverse remap out of a root-level array
    aliases_json: |
      [
        {
          "namespace": "Test.Data",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test.Data/widgets/v[*].state",
                  "defaultPath": "['properties'].other[*].rawstate",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input:
      type: "Test.Data/widgets"
      v:
        - state: s
    round_trip: true

  - note: "a root-level reverse remap leaves an unrelated array of the alias's short name alone"
    aliases_json: |
      [
        {
          "namespace": "Test.Data",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test.Data/widgets/v[*].state",
                  "defaultPath": "other[*].rawstate",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input:
      type: Test.Data/widgets
      v:
        - state: s
      other:
        - rawstate: t
    round_trip: true

  - note: "a root-level reverse remap leaves an unrelated inner array of the alias's short name alone"
    aliases_json: |
      [
        {
          "namespace": "Test.Data",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test.Data/widgets/x[*].y[*].state",
                  "defaultPath": "x[*].other[*].rawstate",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input:
      type: Test.Data/widgets
      x:
        - y:
            - state: s
          other:
            - rawstate: t
    round_trip: true

  - note: "a root-level sub-resource array's inner array gets its renamed leaf back"
    aliases_json: |
      [
        {
          "namespace": "Test.Data",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                {
                  "name": "Test.Data/widgets/x[*].y[*].z",
                  "defaultPath": "x[*].properties.y[*].rawz",
                  "paths": []
                }
              ]
            }
          ]
        }
      ]
    input:
      type: Test.Data/widgets
      x:
        - name: one
          properties:
            y:
              - rawz: 1
    round_trip: true

  - note: a refused plain alias write at the resource root does not stop re-wrapping
    aliases_json: |
      [
        {
          "namespace": "Test.Data",
          "resourceTypes": [
            {
              "resourceType": "widgets",
              "aliases": [
                { "name": "Test.Data/widgets/b", "defaultPath": "x.y", "paths": [] },
                { "name": "Test.Data/widgets/x[*].y[*].z", "defaultPath": "x[*].y[*].properties.z", "paths": [] }
              ]
            }
          ]
        }
      ]
    input:
      type: "Test.Data/widgets"
      x:
        - y:
            - z: 1
      b: 2
    # `x` is an array, so `b` has nowhere to go and is dropped.
    expected_denormalized:
      type: "Test.Data/widgets"
      x:
        - y:
            - properties:
                z: 1
