# Preserve legacy no-wildcard spellings; only counted wildcard references
# gain dotted/bracket equivalence. These expectations pin local compatibility,
# not Azure service parity.  Bound suffixes are navigated with the same
# quoted-key grammar the binder uses, and only an exact `[*]` is a wildcard.
# As in count_bracket_suffix.yaml, every `_no_match` twin flips to deny
# under the wrong binding.
cases:
  - note: bare_bracket_prefix_stays_outer_array
    policy_rule: |
      {"if":{"count":{"field":"items[*]","where":{"count":{"field":"items[*].subs[*]","where":{"field":"items[*]['subs']","equals":"x"}},"greater":0}},"greater":0},"then":{"effect":"deny"}}
    resource:
      items: [{subs: ["x", "y"]}]
    want_undefined: true

  - note: bare_bracket_prefix_array_match
    policy_rule: |
      {"if":{"count":{"field":"items[*]","where":{"count":{"field":"items[*].subs[*]","where":{"field":"items[*]['subs']","equals":["x","y"]}},"greater":0}},"greater":0},"then":{"effect":"deny"}}
    resource:
      items: [{subs: ["x", "y"]}]
    want_effect: deny

  - note: bare_dotted_prefix_keeps_legacy_binding
    policy_rule: |
      {"if":{"count":{"field":"items[*]","where":{"count":{"field":"items[*].subs[*]","where":{"field":"items[*].subs","equals":"x"}},"greater":0}},"greater":0},"then":{"effect":"deny"}}
    resource:
      items: [{subs: ["x", "y"]}]
    want_effect: deny

  - note: bare_dotted_prefix_legacy_array_no_match
    policy_rule: |
      {"if":{"count":{"field":"items[*]","where":{"count":{"field":"items[*].subs[*]","where":{"field":"items[*].subs","equals":["x","y"]}},"greater":0}},"greater":0},"then":{"effect":"deny"}}
    resource:
      items: [{subs: ["x", "y"]}]
    want_undefined: true

  - note: no_wildcard_bracket_prefix_reads_resource
    policy_rule: |
      {"if":{"count":{"field":"props.rules[*]","where":{"value":"[length(field('props[''rules'']'))]","equals":2}},"equals":2},"then":{"effect":"deny"}}
    resource:
      props:
        rules: [{a: 1, b: 2}, {a: 3}]
    want_effect: deny

  - note: no_wildcard_bracket_prefix_resource_no_match
    policy_rule: |
      {"if":{"count":{"field":"props.rules[*]","where":{"value":"[length(field('props[''rules'']'))]","equals":2}},"equals":1},"then":{"effect":"deny"}}
    resource:
      props:
        rules: [{a: 1, b: 2}, {a: 3}]
    want_undefined: true

  - note: no_wildcard_dotted_prefix_keeps_legacy_binding
    policy_rule: |
      {"if":{"count":{"field":"props.rules[*]","where":{"value":"[length(field('props.rules'))]","equals":2}},"equals":1},"then":{"effect":"deny"}}
    resource:
      props:
        rules: [{a: 1, b: 2}, {a: 3}]
    want_effect: deny

  - note: no_wildcard_dotted_prefix_legacy_no_match
    policy_rule: |
      {"if":{"count":{"field":"props.rules[*]","where":{"value":"[length(field('props.rules'))]","equals":2}},"equals":2},"then":{"effect":"deny"}}
    resource:
      props:
        rules: [{a: 1, b: 2}, {a: 3}]
    want_undefined: true

  - note: quoted_delimiters_read_one_key
    policy_rule: |
      {"if":{"count":{"field":"items[*]","where":{"field":"items[*]['a][b']","equals":"x"}},"equals":1},"then":{"effect":"deny"}}
    resource:
      items: [{"a][b": "x", "'a": {"b'": "y"}}]
    want_effect: deny

  - note: quoted_delimiters_do_not_read_split_decoy
    policy_rule: |
      {"if":{"count":{"field":"items[*]","where":{"field":"items[*]['a][b']","equals":"x"}},"equals":1},"then":{"effect":"deny"}}
    resource:
      items: [{"a][b": "y", "'a": {"b'": "x"}}]
    want_undefined: true

  - note: padded_star_is_literal
    policy_rule: |
      {"if":{"count":{"field":"items[*]","where":{"field":"items[ * ].state","equals":"on"}},"equals":1},"then":{"effect":"deny"}}
    resource:
      items: [{state: "on"}, {state: "off"}]
    want_undefined: true

  - note: padded_star_is_literal_reads_nothing
    policy_rule: |
      {"if":{"count":{"field":"items[*]","where":{"field":"items[ * ].state","equals":"on"}},"equals":0},"then":{"effect":"deny"}}
    resource:
      items: [{state: "on"}, {state: "off"}]
    want_effect: deny

  - note: consecutive_wildcards_rejected
    policy_rule: |
      {"if":{"count":{"field":"items[*]","where":{"field":"items[*][*]","equals":"x"}},"greater":0},"then":{"effect":"deny"}}
    want_compile_error: true
    want_compile_error_contains: non-empty prefix

  - note: any_bracket_prefix_dotted_where
    policy_rule: |
      {"if":{"count":{"field":"props['rules'][*]","where":{"field":"props.rules[*].state","equals":"on"}},"greater":0},"then":{"effect":"deny"}}
    resource:
      props:
        rules: [{state: "on"}, {state: "off"}]
    want_effect: deny

  - note: any_bracket_prefix_dotted_where_no_match
    policy_rule: |
      {"if":{"count":{"field":"props['rules'][*]","where":{"not":{"anyOf":[{"field":"props.rules[*].state","equals":"on"},{"field":"props.rules[*].gate","equals":"yes"}]}}},"greater":0},"then":{"effect":"deny"}}
    resource:
      props:
        rules: [{state: "on", gate: "no"}, {state: "off", gate: "yes"}]
    want_undefined: true

  - note: any_dotted_prefix_bracket_where
    policy_rule: |
      {"if":{"count":{"field":"props.rules[*]","where":{"field":"props['rules'][*]['state']","equals":"on"}},"greater":0},"then":{"effect":"deny"}}
    resource:
      props:
        rules: [{state: "on"}, {state: "off"}]
    want_effect: deny

  - note: any_dotted_prefix_bracket_where_no_match
    policy_rule: |
      {"if":{"count":{"field":"props.rules[*]","where":{"not":{"anyOf":[{"field":"props['rules'][*]['state']","equals":"on"},{"field":"props['rules'][*]['gate']","equals":"yes"}]}}},"greater":0},"then":{"effect":"deny"}}
    resource:
      props:
        rules: [{state: "on", gate: "no"}, {state: "off", gate: "yes"}]
    want_undefined: true

  - note: nested_index_suffix_count
    policy_rule: |
      {"if":{"count":{"field":"items[*]","where":{"count":{"field":"items[*][0][*]","where":{"field":"items[*][0][*]","equals":"x"}},"equals":1}},"equals":2},"then":{"effect":"deny"}}
    resource:
      items: [[["x", "y"], ["x", "x"]], [["y", "x"], ["y", "y"]]]
    want_effect: deny

  - note: nested_index_suffix_count_no_match
    policy_rule: |
      {"if":{"count":{"field":"items[*]","where":{"count":{"field":"items[*][0][*]","where":{"field":"items[*][0][*]","equals":"x"}},"equals":1}},"equals":2},"then":{"effect":"deny"}}
    resource:
      items: [[["x", "x"], ["x", "y"]], [["y", "x"], ["x", "y"]]]
    want_undefined: true

  # The twin above catches a wrong index; this one catches an inner count
  # that does not bind to the outer element at all.
  - note: nested_index_suffix_count_target_zero_no_match
    policy_rule: |
      {"if":{"count":{"field":"items[*]","where":{"count":{"field":"items[*][0][*]","where":{"field":"items[*][0][*]","equals":"x"}},"equals":1}},"equals":0},"then":{"effect":"deny"}}
    resource:
      items: [[["x", "y"], ["x", "x"]], [["y", "x"], ["y", "y"]]]
    want_undefined: true

  - note: inner_allof
    policy_rule: |
      {"if":{"count":{"field":"props['rules'][*]","where":{"field":"props.rules[*]['subs'][*]","equals":"x"}},"equals":1},"then":{"effect":"deny"}}
    resource:
      props:
        rules: [{subs: ["x", "x"]}, {subs: ["x", "y"]}]
    want_effect: deny

  - note: inner_allof_no_match
    policy_rule: |
      {"if":{"count":{"field":"props['rules'][*]","where":{"field":"props.rules[*]['subs'][*]","equals":"x"}},"equals":0},"then":{"effect":"deny"}}
    resource:
      props:
        rules: [{subs: ["x", "x"]}, {subs: ["x", "y"]}]
    want_undefined: true

  - note: quoted_delimiters_inner_allof
    policy_rule: |
      {"if":{"count":{"field":"items[*]","where":{"field":"items[*]['a][b'][*]","equals":"x"}},"equals":1},"then":{"effect":"deny"}}
    resource:
      items: [{"a][b": ["x", "x"], "'a": {"b'": ["y"]}}, {"a][b": ["x", "y"], "'a": {"b'": ["y"]}}]
    want_effect: deny

  - note: quoted_delimiters_inner_allof_no_match
    policy_rule: |
      {"if":{"count":{"field":"items[*]","where":{"field":"items[*]['a][b'][*]","equals":"x"}},"equals":1},"then":{"effect":"deny"}}
    resource:
      items: [{"a][b": ["x", "y"], "'a": {"b'": ["x"]}}]
    want_undefined: true

  # Quoted wildcard collection prefixes require the independent quote-aware
  # wildcard path splitting, which is not yet supported. These cases are
  # skipped until it lands.
  - note: quoted_wildcard_key_prefix_pending_splitter
    skip: true
    policy_rule: |
      {"if":{"count":{"field":"m['a[*]'][*]","where":{"field":"m[\"a[*]\"][*].state","equals":"on"}},"equals":1},"then":{"effect":"deny"}}
    resource:
      m: {"a[*]": [{state: "on"}, {state: "off"}]}
    want_effect: deny

  - note: quoted_wildcard_key_prefix_pending_splitter_no_match
    skip: true
    policy_rule: |
      {"if":{"count":{"field":"m['a[*]'][*]","where":{"field":"m[\"a[*]\"][*].state","equals":"on"}},"equals":1},"then":{"effect":"deny"}}
    resource:
      m: {"a[*]": [{state: "on"}, {state: "off"}, {state: "on"}]}
    want_undefined: true
