# Built-in Fields Test Suite
# Tests all built-in field types: type, id, kind, name, location, fullName,
# tags, identity.type, and tag indexing patterns.

cases:
  # =========================================================================
  # Core built-in fields
  # =========================================================================

  - note: field_type
    policy_rule: |
      {
        "if": {
          "field": "type",
          "equals": "Microsoft.Compute/virtualMachines"
        },
        "then": { "effect": "deny" }
      }
    resource:
      type: "Microsoft.Compute/virtualMachines"
    want_effect: "deny"

  - note: field_id
    policy_rule: |
      {
        "if": {
          "field": "id",
          "contains": "/resourceGroups/myRg/"
        },
        "then": { "effect": "audit" }
      }
    resource:
      id: "/subscriptions/sub1/resourceGroups/myRg/providers/Microsoft.Compute/virtualMachines/vm1"
    want_effect: "audit"

  - note: field_kind
    policy_rule: |
      {
        "if": {
          "field": "kind",
          "equals": "StorageV2"
        },
        "then": { "effect": "audit" }
      }
    resource:
      kind: "StorageV2"
    want_effect: "audit"

  - note: field_name
    policy_rule: |
      {
        "if": {
          "field": "name",
          "contains": "prod"
        },
        "then": { "effect": "deny" }
      }
    resource:
      name: "my-prod-vm"
    want_effect: "deny"

  - note: field_location
    policy_rule: |
      {
        "if": {
          "field": "location",
          "equals": "eastus"
        },
        "then": { "effect": "deny" }
      }
    resource:
      location: "eastus"
    want_effect: "deny"

  - note: field_fullName
    policy_rule: |
      {
        "if": {
          "field": "fullName",
          "contains": "Microsoft.Compute"
        },
        "then": { "effect": "audit" }
      }
    resource:
      fullName: "Microsoft.Compute/virtualMachines/vm1"
    want_effect: "audit"

  - note: field_identity_type
    policy_rule: |
      {
        "if": {
          "field": "identity.type",
          "equals": "SystemAssigned"
        },
        "then": { "effect": "audit" }
      }
    resource:
      identity:
        type: "SystemAssigned"
    want_effect: "audit"

  # =========================================================================
  # Tags
  # =========================================================================

  - note: field_tags_object
    policy_rule: |
      {
        "if": {
          "field": "tags",
          "containsKey": "environment"
        },
        "then": { "effect": "audit" }
      }
    resource:
      tags:
        environment: "production"
    want_effect: "audit"

  - note: field_tags_dot_notation
    policy_rule: |
      {
        "if": {
          "field": "tags.environment",
          "equals": "production"
        },
        "then": { "effect": "audit" }
      }
    resource:
      tags:
        environment: "production"
    want_effect: "audit"

  - note: field_tags_numeric_key_bracket
    policy_rule: |
      {
        "if": {
          "field": "tags['123']",
          "equals": "production"
        },
        "then": { "effect": "audit" }
      }
    resource:
      tags:
        "123": "production"
    want_effect: "audit"

  - note: field_tags_double_quoted_bracket_value_differs
    policy_rule: |
      {
        "if": {
          "field": "tags[\"environment\"]",
          "equals": "production"
        },
        "then": { "effect": "deny" }
      }
    resource:
      tags:
        environment: "development"
    want_undefined: true

  - note: field_tags_double_quoted_bracket_missing_tag
    policy_rule: |
      {
        "if": {
          "field": "tags[\"environment\"]",
          "exists": false
        },
        "then": { "effect": "deny" }
      }
    resource:
      tags:
        owner: "team"
    want_effect: "deny"

  - note: field_tags_double_quoted_bracket_present_tag_exists
    policy_rule: |
      {
        "if": {
          "field": "tags[\"environment\"]",
          "exists": false
        },
        "then": { "effect": "deny" }
      }
    resource:
      tags:
        environment: "production"
    want_undefined: true

  - note: field_tags_numeric_key_double_quoted_bracket
    policy_rule: |
      {
        "if": {
          "field": "tags[\"123\"]",
          "equals": "production"
        },
        "then": { "effect": "audit" }
      }
    resource:
      tags:
        "123": "production"
    want_effect: "audit"

  - note: field_tags_numeric_key_bracket_value_differs
    policy_rule: |
      {
        "if": {
          "field": "tags['123']",
          "equals": "production"
        },
        "then": { "effect": "audit" }
      }
    resource:
      tags:
        "123": "development"
    want_undefined: true

  - note: field_array_numeric_index_still_indexes
    policy_rule: |
      {
        "if": {
          "field": "properties.ipRules[1].value",
          "equals": "10.0.0.2"
        },
        "then": { "effect": "audit" }
      }
    resource:
      properties:
        ipRules:
          - value: "10.0.0.1"
          - value: "10.0.0.2"
    want_effect: "audit"

  - note: field_quoted_numeric_key_on_nested_object
    policy_rule: |
      {
        "if": {
          "field": "properties.config['123']",
          "equals": "enabled"
        },
        "then": { "effect": "audit" }
      }
    resource:
      properties:
        config:
          "123": "enabled"
    want_effect: "audit"

  - note: field_quoted_key_preserves_literal_inner_apostrophes
    policy_rule: |
      {
        "if": {
          "field": "properties.config[\"'123'\"]",
          "equals": "development"
        },
        "then": { "effect": "audit" }
      }
    resource:
      properties:
        config:
          "123": "production"
          "'123'": "development"
    want_effect: "audit"

  - note: field_tags_bracket_notation
    policy_rule: |
      {
        "if": {
          "field": "tags['environment']",
          "equals": "production"
        },
        "then": { "effect": "deny" }
      }
    resource:
      tags:
        environment: "production"
    want_effect: "deny"

  - note: field_tags_double_quoted_bracket_notation
    policy_rule: |
      {
        "if": {
          "field": "tags[\"environment\"]",
          "equals": "production"
        },
        "then": { "effect": "deny" }
      }
    resource:
      tags:
        environment: "production"
    want_effect: "deny"

  - note: field_tags_single_quoted_key_containing_wildcard_text
    policy_rule: |
      {
        "if": {
          "field": "tags['dept[*]']",
          "equals": "production"
        },
        "then": { "effect": "audit" }
      }
    resource:
      tags:
        "dept[*]": "production"
    want_effect: "audit"

  - note: field_tags_double_quoted_key_containing_wildcard_text
    policy_rule: |
      {
        "if": {
          "field": "tags[\"dept[*]\"]",
          "equals": "production"
        },
        "then": { "effect": "audit" }
      }
    resource:
      tags:
        "dept[*]": "production"
    want_effect: "audit"

  - note: field_tags_dot_hyphen
    policy_rule: |
      {
        "if": {
          "field": "tags.cost-center",
          "equals": "engineering"
        },
        "then": { "effect": "audit" }
      }
    resource:
      tags:
        cost-center: "engineering"
    want_effect: "audit"

  - note: field_tags_bracket_space
    policy_rule: |
      {
        "if": {
          "field": "tags['Created By']",
          "exists": true
        },
        "then": { "effect": "audit" }
      }
    resource:
      tags:
        Created By: "admin"
    want_effect: "audit"

  - note: field_tags_missing
    policy_rule: |
      {
        "if": {
          "field": "tags.environment",
          "exists": false
        },
        "then": { "effect": "deny" }
      }
    resource:
      tags: {}
    want_effect: "deny"

  # =========================================================================
  # Nested property fields (aliases)
  # =========================================================================
  # Note: These test parsing of alias-like dotted paths in field position.
  # Actual alias resolution is out of scope; these confirm the parser
  # correctly handles them.

  - note: field_deep_property
    policy_rule: |
      {
        "if": {
          "field": "properties.securityProfile.uefiSettings.secureBootEnabled",
          "equals": true
        },
        "then": { "effect": "audit" }
      }
    resource:
      properties:
        securityProfile:
          uefiSettings:
            secureBootEnabled: true
    want_effect: "audit"

  - note: field_multiple_field_conditions
    policy_rule: |
      {
        "if": {
          "allOf": [
            { "field": "type", "equals": "Microsoft.Network/networkSecurityGroups/securityRules" },
            { "field": "name", "contains": "allow" },
            { "field": "location", "in": ["eastus", "westus", "centralus"] },
            { "field": "tags.team", "equals": "security" }
          ]
        },
        "then": { "effect": "audit" }
      }
    resource:
      type: "Microsoft.Network/networkSecurityGroups/securityRules"
      name: "allow-https"
      location: "eastus"
      tags:
        team: "security"
    want_effect: "audit"

  # =========================================================================
  # Bracket notation in field paths
  # =========================================================================

  - note: field_bracket_notation_string_key
    policy_rule: |
      {
        "if": {
          "field": "properties.networkAcls['default-action']",
          "equals": "Allow"
        },
        "then": { "effect": "deny" }
      }
    resource:
      properties:
        networkAcls:
          default-action: "Allow"
    want_effect: "deny"

  - note: field_bracket_notation_double_quote
    policy_rule: |
      {
        "if": {
          "field": "properties.settings['log-level']",
          "equals": "debug"
        },
        "then": { "effect": "deny" }
      }
    resource:
      properties:
        settings:
          log-level: "debug"
    want_effect: "deny"

  # =========================================================================
  # Array index access in field paths
  # =========================================================================

  - note: field_array_index_zero
    policy_rule: |
      {
        "if": {
          "field": "properties.ipConfigurations[0].name",
          "equals": "primary"
        },
        "then": { "effect": "deny" }
      }
    resource:
      properties:
        ipConfigurations:
          - name: "primary"
            properties:
              subnet: "default"
          - name: "secondary"
            properties:
              subnet: "dmz"
    want_effect: "deny"

  - note: field_array_index_one
    policy_rule: |
      {
        "if": {
          "field": "properties.ipConfigurations[1].name",
          "equals": "secondary"
        },
        "then": { "effect": "deny" }
      }
    resource:
      properties:
        ipConfigurations:
          - name: "primary"
          - name: "secondary"
    want_effect: "deny"

  - note: field_array_index_out_of_bounds
    policy_rule: |
      {
        "if": {
          "field": "properties.ipConfigurations[5].name",
          "exists": true
        },
        "then": { "effect": "deny" }
      }
    resource:
      properties:
        ipConfigurations:
          - name: "primary"
    want_undefined: true

  - note: field_overflowing_digit_subscript_is_not_a_key
    policy_rule: |
      {
        "if": {
          "field": "properties.config[18446744073709551616]",
          "exists": true
        },
        "then": { "effect": "deny" }
      }
    resource:
      properties:
        config:
          "18446744073709551616": "decoy"
    want_undefined: true

  - note: field_quoted_overflowing_digits_are_a_key
    policy_rule: |
      {
        "if": {
          "field": "properties.config['18446744073709551616']",
          "exists": true
        },
        "then": { "effect": "deny" }
      }
    resource:
      properties:
        config:
          "18446744073709551616": "v"
    want_effect: "deny"

  # Quoted digits are object keys on every compiler path that splits field paths.

  - note: field_quoted_digit_subscript_on_array_is_not_an_index
    policy_rule: |
      {
        "if": {
          "field": "properties.ipRules['1'].value",
          "equals": "10.0.0.2"
        },
        "then": { "effect": "audit" }
      }
    resource:
      properties:
        ipRules:
          - value: "10.0.0.1"
          - value: "10.0.0.2"
    want_undefined: true

  - note: field_dotted_numeric_segment_is_a_key
    policy_rule: |
      {
        "if": {
          "field": "properties.config.123",
          "equals": "enabled"
        },
        "then": { "effect": "audit" }
      }
    resource:
      properties:
        config:
          "123": "enabled"
    want_effect: "audit"

  - note: field_function_quoted_numeric_key
    policy_rule: |
      {
        "if": {
          "value": "[field('properties.config[''123'']')]",
          "equals": "enabled"
        },
        "then": { "effect": "audit" }
      }
    resource:
      properties:
        config:
          "123": "enabled"
    want_effect: "audit"

  - note: field_function_quoted_numeric_tag_key
    policy_rule: |
      {
        "if": {
          "value": "[field('tags[''123'']')]",
          "equals": "production"
        },
        "then": { "effect": "audit" }
      }
    resource:
      tags:
        "123": "production"
    want_effect: "audit"

  - note: field_wildcard_prefix_quoted_numeric_key
    policy_rule: |
      {
        "if": {
          "field": "properties.groups['123'][*].name",
          "equals": "web"
        },
        "then": { "effect": "audit" }
      }
    resource:
      properties:
        groups:
          "123":
            - name: "web"
            - name: "web"
    want_effect: "audit"

  - note: field_wildcard_suffix_quoted_numeric_key
    policy_rule: |
      {
        "if": {
          "field": "properties.items[*]['123']",
          "equals": "enabled"
        },
        "then": { "effect": "audit" }
      }
    resource:
      properties:
        items:
          - "123": "enabled"
          - "123": "enabled"
    want_effect: "audit"

  - note: field_wildcard_suffix_quoted_numeric_key_one_element_differs
    policy_rule: |
      {
        "if": {
          "field": "properties.items[*]['123']",
          "equals": "enabled"
        },
        "then": { "effect": "audit" }
      }
    resource:
      properties:
        items:
          - "123": "enabled"
          - "123": "disabled"
    want_undefined: true

  - note: field_dotted_numeric_segment_on_array_is_not_an_index
    policy_rule: |
      {
        "if": {
          "field": "properties.ipRules.1.value",
          "equals": "10.0.0.2"
        },
        "then": { "effect": "audit" }
      }
    resource:
      properties:
        ipRules:
          - value: "10.0.0.1"
          - value: "10.0.0.2"
    want_undefined: true

  - note: existence_condition_quoted_numeric_key_matches
    policy_rule: |
      {
        "if": { "field": "type", "equals": "Microsoft.Compute/virtualMachines" },
        "then": {
          "effect": "auditIfNotExists",
          "details": {
            "type": "Microsoft.Compute/virtualMachines/extensions",
            "existenceCondition": {
              "field": "properties.config['123']",
              "equals": "on"
            }
          }
        }
      }
    resource:
      type: "Microsoft.Compute/virtualMachines"
    host_await:
      - response:
          properties:
            config:
              "123": "on"
    want_undefined: true

  - note: existence_condition_quoted_numeric_key_differs
    policy_rule: |
      {
        "if": { "field": "type", "equals": "Microsoft.Compute/virtualMachines" },
        "then": {
          "effect": "auditIfNotExists",
          "details": {
            "type": "Microsoft.Compute/virtualMachines/extensions",
            "existenceCondition": {
              "field": "properties.config['123']",
              "equals": "on"
            }
          }
        }
      }
    resource:
      type: "Microsoft.Compute/virtualMachines"
    host_await:
      - response:
          properties:
            config:
              "123": "off"
    want_effect: "auditIfNotExists"

  - note: existence_count_field_function_reads_primary_resource
    policy_rule: |
      {
        "if": { "value": true, "equals": true },
        "then": {
          "effect": "auditIfNotExists",
          "details": {
            "type": "Contoso.Child/widgets",
            "existenceCondition": {
              "count": {
                "field": "properties.matrix[*]",
                "where": {
                  "value": "[contains(field('properties.matrix[*].x'), 'approved')]",
                  "equals": true
                }
              },
              "equals": 1
            }
          }
        }
      }
    resource:
      properties:
        matrix: [{ x: rejected }]
    host_await:
      - response:
          type: Contoso.Child/widgets
          properties:
            matrix: [{ x: approved }]
    want_effect: auditIfNotExists

  - note: existence_count_field_function_primary_approved_no_audit
    policy_rule: |
      {
        "if": { "value": true, "equals": true },
        "then": {
          "effect": "auditIfNotExists",
          "details": {
            "type": "Contoso.Child/widgets",
            "existenceCondition": {
              "count": {
                "field": "properties.matrix[*]",
                "where": {
                  "value": "[contains(field('properties.matrix[*].x'), 'approved')]",
                  "equals": true
                }
              },
              "equals": 1
            }
          }
        }
      }
    resource:
      properties:
        matrix: [{ x: approved }]
    host_await:
      - response:
          type: Contoso.Child/widgets
          properties:
            matrix: [{ x: rejected }]
    want_undefined: true

  - note: existence_count_field_and_current_read_related_element
    policy_rule: |
      {
        "if": { "value": true, "equals": true },
        "then": {
          "effect": "deployIfNotExists",
          "details": {
            "type": "Contoso.Child/widgets",
            "existenceCondition": {
              "count": {
                "field": "properties.matrix[*]",
                "where": {
                  "allOf": [
                    { "field": "properties.matrix[*].x", "equals": "approved" },
                    { "value": "[current().x]", "equals": "approved" },
                    { "value": "[current('properties.matrix[*].x')]", "equals": "approved" },
                    {
                      "value": "[contains(field('properties.matrix[*].x'), 'approved')]",
                      "equals": false
                    }
                  ]
                }
              },
              "equals": 1
            }
          }
        }
      }
    resource:
      properties:
        matrix: [{ x: rejected }]
    host_await:
      - response:
          type: Contoso.Child/widgets
          properties:
            matrix: [{ x: approved }, { x: rejected }]
    want_undefined: true

  - note: existence_count_field_and_current_related_rejected_audits
    policy_rule: |
      {
        "if": { "value": true, "equals": true },
        "then": {
          "effect": "auditIfNotExists",
          "details": {
            "type": "Contoso.Child/widgets",
            "existenceCondition": {
              "count": {
                "field": "properties.matrix[*]",
                "where": {
                  "allOf": [
                    { "field": "properties.matrix[*].x", "equals": "approved" },
                    { "value": "[current().x]", "equals": "approved" },
                    { "value": "[current('properties.matrix[*].x')]", "equals": "approved" }
                  ]
                }
              },
              "equals": 1
            }
          }
        }
      }
    resource:
      properties:
        matrix: [{ x: approved }]
    host_await:
      - response:
          type: Contoso.Child/widgets
          properties:
            matrix: [{ x: rejected }]
    want_effect: auditIfNotExists

  - note: existence_nested_count_field_function_reads_primary_resource
    policy_rule: |
      {
        "if": { "value": true, "equals": true },
        "then": {
          "effect": "auditIfNotExists",
          "details": {
            "type": "Contoso.Child/widgets",
            "existenceCondition": {
              "count": {
                "field": "properties.matrix[*].cells[*]",
                "where": {
                  "value": "[contains(field('properties.matrix[*].cells[*].x'), 'approved')]",
                  "equals": true
                }
              },
              "equals": 1
            }
          }
        }
      }
    resource:
      properties:
        matrix: [{ cells: [{ x: rejected }] }]
    host_await:
      - response:
          type: Contoso.Child/widgets
          properties:
            matrix: [{ cells: [{ x: approved }] }]
    want_effect: auditIfNotExists

  - note: existence_nested_count_field_function_primary_approved_no_audit
    policy_rule: |
      {
        "if": { "value": true, "equals": true },
        "then": {
          "effect": "auditIfNotExists",
          "details": {
            "type": "Contoso.Child/widgets",
            "existenceCondition": {
              "count": {
                "field": "properties.matrix[*].cells[*]",
                "where": {
                  "value": "[contains(field('properties.matrix[*].cells[*].x'), 'approved')]",
                  "equals": true
                }
              },
              "equals": 1
            }
          }
        }
      }
    resource:
      properties:
        matrix: [{ cells: [{ x: approved }] }]
    host_await:
      - response:
          type: Contoso.Child/widgets
          properties:
            matrix: [{ cells: [{ x: rejected }] }]
    want_undefined: true

  - note: existence_nested_count_outer_field_function_reads_primary_resource
    policy_rule: |
      {
        "if": { "value": true, "equals": true },
        "then": {
          "effect": "auditIfNotExists",
          "details": {
            "type": "Contoso.Child/widgets",
            "existenceCondition": {
              "count": {
                "field": "properties.matrix[*].cells[*]",
                "where": {
                  "value": "[contains(field('properties.matrix[*].tier'), 'high')]",
                  "equals": true
                }
              },
              "equals": 1
            }
          }
        }
      }
    resource:
      properties:
        matrix: [{ tier: low, cells: [{ x: 1 }] }]
    host_await:
      - response:
          type: Contoso.Child/widgets
          properties:
            matrix: [{ tier: high, cells: [{ x: 1 }] }]
    want_effect: auditIfNotExists

  - note: existence_nested_count_outer_field_function_primary_high_no_audit
    policy_rule: |
      {
        "if": { "value": true, "equals": true },
        "then": {
          "effect": "auditIfNotExists",
          "details": {
            "type": "Contoso.Child/widgets",
            "existenceCondition": {
              "count": {
                "field": "properties.matrix[*].cells[*]",
                "where": {
                  "value": "[contains(field('properties.matrix[*].tier'), 'high')]",
                  "equals": true
                }
              },
              "equals": 1
            }
          }
        }
      }
    resource:
      properties:
        matrix: [{ tier: high, cells: [{ x: 1 }] }]
    host_await:
      - response:
          type: Contoso.Child/widgets
          properties:
            matrix: [{ tier: low, cells: [{ x: 1 }] }]
    want_undefined: true

  - note: existence_nested_any_count_field_function_reads_primary_resource
    policy_rule: |
      {
        "if": { "value": true, "equals": true },
        "then": {
          "effect": "auditIfNotExists",
          "details": {
            "type": "Contoso.Child/widgets",
            "existenceCondition": {
              "count": {
                "field": "properties.matrix[*].cells[*]",
