cases:
  - note: basic string formatting with spaces
    data: {}
    modules:
      - |
        package test

        test1 := sprintf("User %s from %s has access", ["alice", "engineering"])
        test2 := sprintf("A %s B %s C", ["X", "Y"])
        test3 := sprintf("No spaces%s%s", ["A", "B"])
        test4 := sprintf("Single %s", ["word"])
        test5 := sprintf("Start %s end", ["middle"])
    query: data.test
    want_result:
      test1: "User alice from engineering has access"
      test2: "A X B Y C"
      test3: "No spacesAB"
      test4: "Single word"
      test5: "Start middle end"

  - note: numeric formatting
    data: {}
    modules:
      - |
        package test

        decimal := sprintf("Number: %d", [42])
        float := sprintf("Float: %f", [3.14])
        hex := sprintf("Hex: %x", [255])
        octal := sprintf("Octal: %o", [64])
        binary := sprintf("Binary: %b", [15])
    query: data.test
    want_result:
      decimal: "Number: 42"
      float: "Float: 3.14"
      hex: "Hex: ff"
      octal: "Octal: 0O100"
      binary: "Binary: 1111"

  - note: mixed types and escaping
    data: {}
    modules:
      - |
        package test

        mixed := sprintf("String: %s, Number: %d, Percent: %%", ["hello", 123])
        verbose := sprintf("Value: %v", [{"key": "value"}])
    query: data.test
    want_result:
      mixed: "String: hello, Number: 123, Percent: %"
      verbose: "Value: {\"key\": \"value\"}"

  - note: width formatting
    data: {}
    modules:
      - |
        package test

        padded := sprintf("Padded: %5d", [42])
        zero_padded := sprintf("Zero padded: %05d", [42])
        decimal_places := sprintf("Decimal: %.2f", [3.14159])
    query: data.test
    want_result:
      padded: "Padded:    42"
      zero_padded: "Zero padded: 00042"
      decimal_places: "Decimal: 3.14"

  - note: error cases
    data: {}
    modules:
      - |
        package test

        # This should cause an error - missing argument
        error_case := sprintf("Value: %s %d", ["only_one"])
    query: data.test
    error: "no argument specified for format verb 1"

  - note: "%q string quoting (strconv.Quote / Go-syntax quoted string)"
    data: {}
    modules:
      - |
        package test

        plain := sprintf("%q", ["foo"])
        double_quote := sprintf("%q", ["a\"b"])
        backslash := sprintf("%q", ["back\\slash"])
        tab := sprintf("%q", ["tab\there"])
        newline := sprintf("%q", ["nl\nhere"])
        carriage_return := sprintf("%q", ["cr\rhere"])
        emoji := sprintf("%q", ["emoji🙂"])
        non_ascii := sprintf("%q", ["юнікод"])
        # %q must NOT HTML-escape < > & (that is what distinguishes it from
        # json.marshal).
        angle_and_amp := sprintf("%q", ["a<b>&c"])
        soft_hyphen := sprintf("%q", ["\u00ad"])
        zero_width_space := sprintf("%q", ["\u200b"])
        line_separator := sprintf("%q", ["a\u2028b"])
        paragraph_separator := sprintf("%q", ["a\u2029b"])
        private_use := sprintf("%q", ["\ue000"])
        noncharacter := sprintf("%q", ["\ufdd0"])
        unassigned := sprintf("%q", ["\u0378"])
        empty := sprintf("%q", [""])
    query: data.test
    want_result:
      plain: "\"foo\""
      double_quote: "\"a\\\"b\""
      backslash: "\"back\\\\slash\""
      tab: "\"tab\\there\""
      newline: "\"nl\\nhere\""
      carriage_return: "\"cr\\rhere\""
      emoji: "\"emoji🙂\""
      non_ascii: "\"юнікод\""
      angle_and_amp: "\"a<b>&c\""
      soft_hyphen: "\"\\u00ad\""
      zero_width_space: "\"\\u200b\""
      line_separator: "\"a\\u2028b\""
      paragraph_separator: "\"a\\u2029b\""
      private_use: "\"\\ue000\""
      noncharacter: "\"\\ufdd0\""
      unassigned: "\"\\u0378\""
      empty: "\"\""

  - note: "%q width and precision"
    data: {}
    modules:
      - |
        package test

        padded := sprintf("%10q", ["foo"])
        zero_padded := sprintf("%05q", ["a"])
        truncated := sprintf("%.3q", ["abcdef"])
        empty := sprintf("%.0q", ["abcdef"])
        unicode_width := sprintf("%6q", ["🙂"])
        unicode_precision := sprintf("%.1q", ["🙂x"])
    query: data.test
    want_result:
      padded: "     \"foo\""
      zero_padded: "00\"a\""
      truncated: "\"abc\""
      empty: "\"\""
      unicode_width: "   \"🙂\""
      unicode_precision: "\"🙂\""

  - note: "%q full string format specification"
    data: {}
    modules:
      - |
        package test

        ascii_only := sprintf("%+q", ["é🙂"])
        raw := sprintf("%#q", ["a\tb"])
        raw_fallback := sprintf("%#q", ["a\nb"])
        left_aligned := sprintf("%-8q", ["é"])
        width_and_precision := sprintf("%8.1q", ["éx"])
        ascii_width_and_precision := sprintf("%+14.1q", ["éx"])
        raw_width_and_precision := sprintf("%#8.2q", ["abx"])
        dynamic := sprintf("%*.*q", [8, 1, "éx"])
        indexed := sprintf("%[3]*.[2]*[1]q", ["éx", 1, 8])
    query: data.test
    want_result:
      ascii_only: "\"\\u00e9\\U0001f642\""
      raw: "`a\tb`"
      raw_fallback: "\"a\\nb\""
      left_aligned: "\"é\"     "
      width_and_precision: "     \"é\""
      ascii_width_and_precision: "      \"\\u00e9\""
      raw_width_and_precision: "    `ab`"
      dynamic: "     \"é\""
      indexed: "     \"é\""

  - note: "%q follows OPA value conversion semantics"
    data: {}
    modules:
      - |
        package test

        rune := sprintf("%q", [97])
        control_rune := sprintf("%q", [0])
        quote_rune := sprintf("%q", [39])
        invalid_rune := sprintf("%q", [-1])
        ascii_rune := sprintf("%+q", [233])
        padded_rune := sprintf("%8q", [97])
        fractional := sprintf("%q", [65.5])
        fractional_width := sprintf("%8q", [65.5])
        fractional_precision := sprintf("%.2q", [65.5])
        fractional_zero_padded := sprintf("%08q", [65.5])
        fractional_alternate := sprintf("%#q", [65.5])
        bad_dynamic_precision := sprintf("%.*q", [-1, "x"])
        bad_index := sprintf("%[1]2q", ["x"])
        bad_index_precision := sprintf("%[1].2q", ["x"])
        bad_index_does_not_consume := sprintf("%[2]2q %q", ["x"])
        big_integer := sprintf("%q", [9223372036854775808])
        boolean := sprintf("%q", [true])
        null_value := sprintf("%q", [null])
        array := sprintf("%q", [[1, "x"]])
        set := sprintf("%q", [{true, 1, "x"}])
        object := sprintf("%q", [{"b": 2, "a": 1}])
    query: data.test
    want_result:
      rune: "'a'"
      control_rune: "'\\x00'"
      quote_rune: "'\\''"
      invalid_rune: "'�'"
      ascii_rune: "'\\u00e9'"
      padded_rune: "     'a'"
      fractional: "%!q(float64=65.5)"
      fractional_width: "%!q(float64=    65.5)"
      fractional_precision: "%!q(float64=66)"
      fractional_zero_padded: "%!q(float64=000065.5)"
      fractional_alternate: "%!q(float64=65.5000)"
      bad_dynamic_precision: "%!(BADPREC)\"x\""
      bad_index: "%!q(BADINDEX)"
      bad_index_precision: "%!q(BADINDEX)"
      bad_index_does_not_consume: "%!q(BADINDEX) \"x\""
      big_integer: "%!q(big.Int=9223372036854775808)"
      boolean: "\"true\""
      null_value: "\"null\""
      array: "\"[1, \\\"x\\\"]\""
      set: "\"{true, 1, \\\"x\\\"}\""
      object: "\"{\\\"a\\\": 1, \\\"b\\\": 2}\""
