cases:
  - note: basic string formatting with spaces
    data: {}
    modules:
      - |
        package test

        test1 := sprintf("User %s from %s has access", ["alice", "engineering"])
        test2 := sprintf("A %s B %s C", ["X", "Y"])
        test3 := sprintf("No spaces%s%s", ["A", "B"])
        test4 := sprintf("Single %s", ["word"])
        test5 := sprintf("Start %s end", ["middle"])
    query: data.test
    want_result:
      test1: "User alice from engineering has access"
      test2: "A X B Y C"
      test3: "No spacesAB"
      test4: "Single word"
      test5: "Start middle end"

  - note: numeric formatting
    data: {}
    modules:
      - |
        package test

        decimal := sprintf("Number: %d", [42])
        float := sprintf("Float: %f", [3.14])
        hex := sprintf("Hex: %x", [255])
        octal := sprintf("Octal: %o", [64])
        binary := sprintf("Binary: %b", [15])
    query: data.test
    want_result:
      decimal: "Number: 42"
      float: "Float: 3.14"
      hex: "Hex: ff"
      octal: "Octal: 0O100"
      binary: "Binary: 1111"

  - note: mixed types and escaping
    data: {}
    modules:
      - |
        package test

        mixed := sprintf("String: %s, Number: %d, Percent: %%", ["hello", 123])
        verbose := sprintf("Value: %v", [{"key": "value"}])
        booleans := sprintf("%t %t", [true, false])
    query: data.test
    want_result:
      mixed: "String: hello, Number: 123, Percent: %"
      verbose: "Value: {\"key\": \"value\"}"
      booleans: "true false"

  - note: width formatting
    data: {}
    modules:
      - |
        package test

        padded := sprintf("Padded: %5d", [42])
        zero_padded := sprintf("Zero padded: %05d", [42])
        decimal_places := sprintf("Decimal: %.2f", [3.14159])
    query: data.test
    want_result:
      padded: "Padded:    42"
      zero_padded: "Zero padded: 00042"
      decimal_places: "Decimal: 3.14"

  - note: error cases
    data: {}
    modules:
      - |
        package test

        # This should cause an error - missing argument
        error_case := sprintf("Value: %s %d", ["only_one"])
    query: data.test
    error: "no argument specified for format verb 1"

  - note: "%q string quoting (strconv.Quote / Go-syntax quoted string)"
    data: {}
    modules:
      - |
        package test

        plain := sprintf("%q", ["foo"])
        double_quote := sprintf("%q", ["a\"b"])
        backslash := sprintf("%q", ["back\\slash"])
        tab := sprintf("%q", ["tab\there"])
        newline := sprintf("%q", ["nl\nhere"])
        carriage_return := sprintf("%q", ["cr\rhere"])
        emoji := sprintf("%q", ["emoji🙂"])
        non_ascii := sprintf("%q", ["юнікод"])
        # %q must NOT HTML-escape < > & (that is what distinguishes it from
        # json.marshal).
        angle_and_amp := sprintf("%q", ["a<b>&c"])
        soft_hyphen := sprintf("%q", ["\u00ad"])
        zero_width_space := sprintf("%q", ["\u200b"])
        line_separator := sprintf("%q", ["a\u2028b"])
        paragraph_separator := sprintf("%q", ["a\u2029b"])
        private_use := sprintf("%q", ["\ue000"])
        noncharacter := sprintf("%q", ["\ufdd0"])
        unassigned := sprintf("%q", ["\u0378"])
        empty := sprintf("%q", [""])
    query: data.test
    want_result:
      plain: "\"foo\""
      double_quote: "\"a\\\"b\""
      backslash: "\"back\\\\slash\""
      tab: "\"tab\\there\""
      newline: "\"nl\\nhere\""
      carriage_return: "\"cr\\rhere\""
      emoji: "\"emoji🙂\""
      non_ascii: "\"юнікод\""
      angle_and_amp: "\"a<b>&c\""
      soft_hyphen: "\"\\u00ad\""
      zero_width_space: "\"\\u200b\""
      line_separator: "\"a\\u2028b\""
      paragraph_separator: "\"a\\u2029b\""
      private_use: "\"\\ue000\""
      noncharacter: "\"\\ufdd0\""
      unassigned: "\"\\u0378\""
      empty: "\"\""

  - note: "%q width and precision"
    data: {}
    modules:
      - |
        package test

        padded := sprintf("%10q", ["foo"])
        zero_padded := sprintf("%05q", ["a"])
        truncated := sprintf("%.3q", ["abcdef"])
        empty := sprintf("%.0q", ["abcdef"])
        unicode_width := sprintf("%6q", ["🙂"])
        unicode_precision := sprintf("%.1q", ["🙂x"])
    query: data.test
    want_result:
      padded: "     \"foo\""
      zero_padded: "00\"a\""
      truncated: "\"abc\""
      empty: "\"\""
      unicode_width: "   \"🙂\""
      unicode_precision: "\"🙂\""

  - note: "%q on a number still errors"
    data: {}
    modules:
      - |
        package test

        error_case := sprintf("%q", [42])
    query: data.test
    error: "number specified for format verb q."

  - note: "%q on a non-string, non-number value still errors (only Value::String is supported)"
    data: {}
    modules:
      - |
        package test

        error_case := sprintf("%q", [true])
    query: data.test
    error: "Go-syntax format verbs %#v. %q, %p and %T are not supported."
