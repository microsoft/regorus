cases:
  - note: basic add operation
    data: {}
    modules:
      - |
        package test

        obj = {"a": {"foo": 1}}
        patches = [{"op": "add", "path": "/a/bar", "value": 2}]
        result = json.patch(obj, patches)
    query: data.test.result
    want_result:
      a:
        foo: 1
        bar: 2

  - note: basic remove operation
    data: {}
    modules:
      - |
        package test

        obj = {"a": {"foo": 1, "bar": 2}}
        patches = [{"op": "remove", "path": "/a/bar"}]
        result = json.patch(obj, patches)
    query: data.test.result
    want_result:
      a:
        foo: 1

  - note: basic replace operation
    data: {}
    modules:
      - |
        package test

        obj = {"a": {"foo": 1}}
        patches = [{"op": "replace", "path": "/a/foo", "value": 42}]
        result = json.patch(obj, patches)
    query: data.test.result
    want_result:
      a:
        foo: 42

  - note: basic move operation
    data: {}
    modules:
      - |
        package test

        obj = {"a": {"foo": 1}, "b": {}}
        patches = [{"op": "move", "from": "/a/foo", "path": "/b/foo"}]
        result = json.patch(obj, patches)
    query: data.test.result
    want_result:
      a: {}
      b:
        foo: 1

  - note: basic copy operation
    data: {}
    modules:
      - |
        package test

        obj = {"a": {"foo": 1}, "b": {}}
        patches = [{"op": "copy", "from": "/a/foo", "path": "/b/foo"}]
        result = json.patch(obj, patches)
    query: data.test.result
    want_result:
      a:
        foo: 1
      b:
        foo: 1

  - note: basic test operation (successful)
    data: {}
    modules:
      - |
        package test

        obj = {"a": {"foo": 1}}
        patches = [{"op": "test", "path": "/a/foo", "value": 1}]
        result = json.patch(obj, patches)
    query: data.test.result
    want_result:
      a:
        foo: 1

  - note: multiple operations
    data: {}
    modules:
      - |
        package test

        obj = {"a": {"foo": 1}}
        patches = [
          {"op": "add", "path": "/a/bar", "value": 2},
          {"op": "replace", "path": "/a/foo", "value": 42}
        ]
        result = json.patch(obj, patches)
    query: data.test.result
    want_result:
      a:
        foo: 42
        bar: 2

  - note: array operations - add to array
    data: {}
    modules:
      - |
        package test

        obj = {"arr": [1, 2, 3]}
        patches = [{"op": "add", "path": "/arr/1", "value": "inserted"}]
        result = json.patch(obj, patches)
    query: data.test.result
    want_result:
      arr: [1, "inserted", 2, 3]

  - note: array operations - add to end of array
    data: {}
    modules:
      - |
        package test

        obj = {"arr": [1, 2, 3]}
        patches = [{"op": "add", "path": "/arr/-", "value": 4}]
        result = json.patch(obj, patches)
    query: data.test.result
    want_result:
      arr: [1, 2, 3, 4]

  - note: array operations - remove from array
    data: {}
    modules:
      - |
        package test

        obj = {"arr": [1, 2, 3]}
        patches = [{"op": "remove", "path": "/arr/1"}]
        result = json.patch(obj, patches)
    query: data.test.result
    want_result:
      arr: [1, 3]

  - note: nested object operations
    data: {}
    modules:
      - |
        package test

        obj = {"a": {"b": {"c": {"d": 1}}}}
        patches = [{"op": "add", "path": "/a/b/c/e", "value": 2}]
        result = json.patch(obj, patches)
    query: data.test.result
    want_result:
      a:
        b:
          c:
            d: 1
            e: 2

  - note: special characters in keys
    data: {}
    modules:
      - |
        package test

        obj = {"foo/bar": {"baz~": 1}}
        patches = [{"op": "add", "path": "/foo~1bar/baz~0test", "value": 2}]
        result = json.patch(obj, patches)
    query: data.test.result
    want_result:
      "foo/bar":
        "baz~": 1
        "baz~test": 2

  - note: empty object and array handling
    data: {}
    modules:
      - |
        package test

        obj = {}
        patches = [{"op": "add", "path": "/newkey", "value": {"nested": []}}]
        result = json.patch(obj, patches)
    query: data.test.result
    want_result:
      newkey:
        nested: []

  - note: complex value types
    data: {}
    modules:
      - |
        package test

        obj = {"data": null}
        patches = [
          {"op": "replace", "path": "/data", "value": {"bool": true, "num": 3.14, "str": "hello"}}
        ]
        result = json.patch(obj, patches)
    query: data.test.result
    want_result:
      data:
        bool: true
        num: 3.14
        str: "hello"

  - note: set add addresses the member by value with an array-form path
    data: {}
    modules:
      - |
        package test

        obj = {"a", "b", "c"}
        patches = [{"op": "add", "path": ["d"], "value": "d"}]
        result = json.patch(obj, patches)
    query: data.test.result == {"a", "b", "c", "d"}
    want_result: true

  - note: set remove addresses the member by value with an array-form path
    data: {}
    modules:
      - |
        package test

        obj = {"a", "b", "c"}
        patches = [{"op": "remove", "path": ["b"]}]
        result = json.patch(obj, patches)
    query: data.test.result == {"a", "c"}
    want_result: true

  - note: set move removes and reinserts a member by value with array-form paths
    data: {}
    modules:
      - |
        package test

        obj = {"a", "b", "c"}
        patches = [{"op": "move", "from": ["a"], "path": ["a"]}]
        result = json.patch(obj, patches)
    query: data.test.result == {"a", "b", "c"}
    want_result: true

  - note: array-form path rejects an integral float index
    data: {}
    modules:
      - |
        package test

        result := json.patch(["a", "b"], [{"op": "remove", "path": [1.0]}])
    query: data.test.result
    no_result: true

  - note: removing the root produces undefined rather than null
    data: {}
    modules:
      - |
        package test

        result := json.patch({"a": 1}, [{"op": "remove", "path": ""}])
    query: data.test.result
    no_result: true

  - note: root add after root remove restores the document
    data: {}
    modules:
      - |
        package test

        result := json.patch({"a": 1}, [{"op": "remove", "path": ""}, {"op": "add", "path": "", "value": {"b": 2}}])
    query: data.test.result
    want_result:
      b: 2

  - note: replace nested value inside a set member
    data: {}
    modules:
      - |
        package test

        target := {{"a": [1, 2]}}
        member := {"a": [1, 2]}
        result := json.patch(target, [{"op": "replace", "path": [member, "a", 1], "value": 9}])
    query: 'data.test.result == {{"a": [1, 9]}}'
    want_result: true

  - note: copy nested value inside a set member
    data: {}
    modules:
      - |
        package test

        target := {{"a": [1]}}
        member := {"a": [1]}
        result := json.patch(target, [{"op": "copy", "from": [member, "a", 0], "path": [member, "a", "-"]}])
    query: 'data.test.result == {{"a": [1, 1]}}'
    want_result: true

  - note: test nested value inside a set member
    data: {}
    modules:
      - |
        package test

        member := {"a": [1, 2]}
        result := json.patch({member}, [{"op": "test", "path": [member, "a", 1], "value": 2}])
    query: 'data.test.result == {{"a": [1, 2]}}'
    want_result: true

  - note: reject negative array index
    data: {}
    modules:
      - |
        package test
        result := json.patch([1, 2], [{"op": "remove", "path": [-1]}])
    query: data.test.result
    no_result: true

  - note: reject overflowing array index
    data: {}
    modules:
      - |
        package test
        result := json.patch([1, 2], [{"op": "remove", "path": [999999999999999999999999999999999999]}])
    query: data.test.result
    no_result: true

  - note: reject leading zero array index
    data: {}
    modules:
      - |
        package test
        result := json.patch([1, 2], [{"op": "remove", "path": "/01"}])
    query: data.test.result
    no_result: true

  - note: reject dash index for remove
    data: {}
    modules:
      - |
        package test
        result := json.patch([1, 2], [{"op": "remove", "path": "/-"}])
    query: data.test.result
    no_result: true

  - note: reject missing operation attribute
    data: {}
    modules:
      - |
        package test
        result := json.patch({}, [{"path": "/a", "value": 1}])
    query: data.test.result
    no_result: true

  - note: reject missing path attribute
    data: {}
    modules:
      - |
        package test
        result := json.patch({}, [{"op": "add", "value": 1}])
    query: data.test.result
    no_result: true

  - note: reject missing value attribute
    data: {}
    modules:
      - |
        package test
        result := json.patch({}, [{"op": "add", "path": "/a"}])
    query: data.test.result
    no_result: true

  - note: reject missing from attribute
    data: {}
    modules:
      - |
        package test
        result := json.patch({}, [{"op": "move", "path": "/a"}])
    query: data.test.result
    no_result: true

  - note: reject malformed operation and path types
    data: {}
    modules:
      - |
        package test
        result := json.patch({}, [{"op": 1, "path": {}, "value": 1}])
    query: data.test.result
    no_result: true

  - note: reject moving a node into its own child
    data: {}
    modules:
      - |
        package test
        result := json.patch({"a": {"b": 1}}, [{"op": "move", "from": "/a", "path": "/a/c"}])
    query: data.test.result
    no_result: true

  - note: failed patch does not mutate its input value
    data: {}
    modules:
      - |
        package test

        original := {"a": [1, 2, 3]}
        failed := json.patch(original, [
          {"op": "remove", "path": "/a/0"},
          {"op": "remove", "path": "/missing"}
        ])
        original_unchanged {
          original == {"a": [1, 2, 3]}
        }
    query: data.test.original_unchanged
    want_result: true
